[Unit]
# The image is deliberately shipped with an empty /etc/machine-id. systemd
# generates and commits the device machine-id before ssh.service is started,
# which makes Debian's ConditionFirstBoot=yes false by the time this unit is
# pulled in. Keep Debian's read-write and non-symlink safety conditions, but
# run its idempotent `ssh-keygen -A` once per boot so missing host keys are
# always repaired before ssh.service validates its configuration.
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
