<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Files - Memory & Skills</title>
<style>
:root {
  --bg: oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg: oklch(18% 0.012 250);
  --muted: oklch(54% 0.012 250);
  --border: oklch(92% 0.005 250);
  --accent: oklch(58% 0.18 255);
  --accent-purple: oklch(58% 0.18 290);
  --detail-drawer-width: min(560px, 42vw);
  --font-body: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html { background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased }
body { min-height: 100vh; background: linear-gradient(to bottom, var(--surface), var(--bg) 360px) }
.page { width: min(1200px, calc(100vw - 48px)); margin: 0 auto; padding: 24px 0 56px }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px }
.brand { display: flex; align-items: center; gap: 10px }
.mark { width: 24px; height: 24px; border-radius: 6px; background: var(--fg); position: relative }
.mark::before,.mark::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 999px; background: white }
.mark::before { top: 7px } .mark::after { bottom: 7px }
.brand strong { font-size: 14px; letter-spacing: -0.01em }
.topbar-actions { display: flex; align-items: center; gap: 10px }
.meta-info { color: var(--muted); font-size: 12px }
.refresh-btn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); text-decoration: none; font-size: 12px; font-weight: 650 }
.refresh-btn:hover { background: color-mix(in oklch, var(--accent) 5%, white); border-color: color-mix(in oklch, var(--accent) 24%, var(--border)) }
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px }
.summary-card { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 14px }
.summary-card .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase }
.summary-card .value { margin-top: 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.03em }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border) }
.tab { padding: 10px 16px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; transition: all 150ms }
.tab:hover { color: var(--fg) }
.tab.active { color: var(--accent); border-bottom-color: var(--accent) }
.tab.active.skills-tab { color: var(--accent-purple); border-bottom-color: var(--accent-purple) }
.tab-content { display: none }
.tab-content.active { display: block }
.panel { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden }
.panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--bg) 80%, white) }
.panel-title { font-size: 14px; font-weight: 650 }
.file-list { list-style: none }
.file-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 120ms; display: flex; justify-content: space-between; align-items: center }
.file-item:hover { background: color-mix(in oklch, var(--accent) 4%, white) }
.file-item:last-child { border-bottom: none }
.file-name { font-family: var(--font-mono); font-size: 13px; font-weight: 600 }
.file-meta { color: var(--muted); font-size: 11px; margin-top: 4px }
.dir-header {
  padding: 12px 16px;
  background: linear-gradient(to right, color-mix(in oklch, var(--accent) 8%, white), color-mix(in oklch, var(--accent) 3%, white));
  border-top: 1px solid color-mix(in oklch, var(--accent) 20%, var(--border));
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  transition: background 150ms;
}
.dir-header:hover { background: linear-gradient(to right, color-mix(in oklch, var(--accent) 12%, white), color-mix(in oklch, var(--accent) 6%, white)) }
.dir-header.skills-dir { background: linear-gradient(to right, color-mix(in oklch, var(--accent-purple) 8%, white), color-mix(in oklch, var(--accent-purple) 3%, white)); border-top-color: color-mix(in oklch, var(--accent-purple) 20%, var(--border)) }
.dir-header.skills-dir:hover { background: linear-gradient(to right, color-mix(in oklch, var(--accent-purple) 12%, white), color-mix(in oklch, var(--accent-purple) 6%, white)) }
.dir-icon { display: inline-block; width: 14px; transition: transform 200ms; color: var(--accent); font-size: 10px }
.dir-header.skills-dir .dir-icon { color: var(--accent-purple) }
.dir-header.collapsed .dir-icon { transform: rotate(-90deg) }
.dir-name { flex: 1; font-family: var(--font-mono); letter-spacing: 0.01em }
.dir-folder-icon { color: var(--accent); font-size: 14px }
.dir-header.skills-dir .dir-folder-icon { color: var(--accent-purple) }
.dir-count { font-size: 11px; color: var(--muted); font-weight: 600; padding: 2px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px }
.file-list.collapsed { display: none }
.file-list .file-item { padding-left: 32px }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); font-size: 10px; font-weight: 700; margin-left: 6px }
.badge.hidden { color: oklch(48% 0.12 75); border-color: color-mix(in oklch, oklch(70% 0.14 75) 34%, var(--border)); background: color-mix(in oklch, oklch(70% 0.14 75) 10%, white) }
.badge.json { color: oklch(42% 0.13 150); border-color: color-mix(in oklch, oklch(58% 0.16 145) 32%, var(--border)); background: color-mix(in oklch, oklch(58% 0.16 145) 8%, white) }
.badge.text { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 32%, var(--border)); background: color-mix(in oklch, var(--accent) 8%, white) }
.badge.image { color: oklch(52% 0.16 28); border-color: color-mix(in oklch, oklch(60% 0.17 28) 32%, var(--border)); background: color-mix(in oklch, oklch(60% 0.17 28) 8%, white) }
.drawer-backdrop { position: fixed; inset: 0; z-index: 40; background: color-mix(in oklch, var(--fg) 18%, transparent); opacity: 0; pointer-events: none; transition: opacity 180ms ease }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(720px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -24px 0 80px color-mix(in oklch, var(--fg) 10%, transparent); transform: translateX(100%); transition: transform 220ms ease, right 220ms ease, width 220ms ease; display: flex; flex-direction: column }
.detail-drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: var(--detail-drawer-width); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -24px 0 80px color-mix(in oklch, var(--fg) 10%, transparent); transform: translateX(100%); transition: transform 220ms ease; display: flex; flex-direction: column }
body.open .drawer-backdrop { opacity: 1; pointer-events: auto }
body.open .drawer { transform: translateX(0) }
body.detail-open .drawer { right: var(--detail-drawer-width); width: min(720px, calc(100vw - var(--detail-drawer-width))) }
body.detail-open .detail-drawer { transform: translateX(0) }
.drawer-top { padding: 18px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, color-mix(in oklch, var(--bg) 72%, white), var(--surface)); flex-shrink: 0; position: relative }
.drawer-top h2 { font-size: 18px; letter-spacing: -0.02em; margin-bottom: 8px; font-family: var(--font-mono); padding-right: 40px; word-break: break-all }
.drawer-chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 11px }
.close-btn { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center }
.drawer-body { flex: 1; min-height: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; padding: 16px }
.block { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 12px }
.block:last-child { margin-bottom: 0 }
.block-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--bg) 72%, white) }
.block-head strong { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase }
.block-head span { color: var(--muted); font-family: var(--font-mono); font-size: 10px }
.block-body { padding: 12px 14px; font-size: 13px; line-height: 1.6 }
pre.block-body { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; max-height: 600px; overflow-y: auto }
.image-preview-body { padding: 12px; display: flex; flex-direction: column; gap: 10px }
.image-preview-frame { min-height: 220px; max-height: min(70vh, 680px); border: 1px solid var(--border); border-radius: 8px; background: color-mix(in oklch, var(--bg) 70%, white); display: flex; align-items: center; justify-content: center; overflow: hidden }
.image-preview-frame img { display: block; max-width: 100%; max-height: min(66vh, 640px); object-fit: contain }
.image-preview-error { color: oklch(48% 0.15 28); font-size: 12px }
.image-preview-note { color: var(--muted); font-size: 12px }
.content-lines { padding: 0; max-height: 600px; overflow-y: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.65 }
.content-line { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: stretch; min-height: 24px }
.content-line:nth-child(odd) { background: color-mix(in oklch, var(--bg) 70%, white) }
.content-line:nth-child(even) { background: color-mix(in oklch, oklch(88% 0.03 250) 38%, white) }
.content-line-no { padding: 2px 10px; color: var(--muted); text-align: right; border-right: 1px solid var(--border); font-variant-numeric: tabular-nums; user-select: none }
.content-line-text { padding: 2px 12px; white-space: pre-wrap; word-break: break-word }
.content-more { padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 10px }
.content-more span { color: var(--muted); font-size: 12px }
.content-more-btn { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; font-size: 12px; font-weight: 600 }
.content-more-btn:hover { background: color-mix(in oklch, var(--accent) 4%, white) }
.screenshot-ref-link { color: var(--accent); text-decoration: none; font-family: inherit; font-size: inherit; font-weight: 650 }
.screenshot-ref-link:hover { text-decoration: underline }
.empty-state { padding: 40px; text-align: center; color: var(--muted) }
@media (max-width: 768px) {
  .summary { grid-template-columns: repeat(2, 1fr) }
  .drawer { width: 100vw }
  .detail-drawer { width: 100vw }
  body.detail-open .drawer { right: 0; width: 100vw }
  .page { width: calc(100vw - 24px) }
}
</style>
</head>
<body>
<main class="page">
<header class="topbar">
  <div class="brand"><div class="mark"></div><strong>Agent Files Browser</strong></div>
  <div class="topbar-actions">
    <div class="meta-info">Generated {{TIMESTAMP}}</div>
    <a id="user-files-refresh" class="refresh-btn" href="/user_files?refresh=1">Refresh data</a>
  </div>
</header>
<section class="summary">
  <article class="summary-card"><div class="label">Memory Files</div><div class="value">{{MEMORY_COUNT}}</div></article>
  <article class="summary-card"><div class="label">Memory Size</div><div class="value">{{MEMORY_SIZE}}</div></article>
  <article class="summary-card"><div class="label">Skills Files</div><div class="value">{{SKILLS_COUNT}}</div></article>
  <article class="summary-card"><div class="label">Skills Size</div><div class="value">{{SKILLS_SIZE}}</div></article>
</section>
<div class="tabs">
  <button class="tab active" data-tab="memory">Memory</button>
  <button class="tab skills-tab" data-tab="skills">Skills</button>
  <button class="tab" data-tab="skill-state" style="background:color-mix(in oklch,oklch(58% 0.18 150) 8%,white);border-color:color-mix(in oklch,oklch(58% 0.18 150) 32%,var(--border))">Skill State</button>
</div>
<div id="memory-content" class="tab-content active"></div>
<div id="skills-content" class="tab-content"></div>
<div id="skill-state-content" class="tab-content"></div>
</main>
<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <h2 id="dTitle">—</h2>
    <div class="drawer-chips" id="dChips"></div>
    <button class="close-btn" id="closeBtn">&times;</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>
<aside class="detail-drawer" id="detailDrawer" inert aria-hidden="true">
  <div class="drawer-top">
    <h2 id="detailTitle">—</h2>
    <div class="drawer-chips" id="detailChips"></div>
    <button class="close-btn" id="detailCloseBtn" aria-label="Close screenshot details">&times;</button>
  </div>
  <div class="drawer-body" id="detailBody"></div>
</aside>
<script>
const MEMORY_DATA = {{MEMORY_JSON}};
const SKILLS_DATA = {{SKILLS_JSON}};
const SKILL_STATE_DATA = {{SKILL_STATE_JSON}};

const backdrop = document.getElementById("backdrop");
const closeBtn = document.getElementById("closeBtn");
const detailDrawer = document.getElementById("detailDrawer");
const detailCloseBtn = document.getElementById("detailCloseBtn");
const CONTENT_INITIAL_LINE_LIMIT = 500;
let detailDrawerTrigger = null;

function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function formatSize(bytes) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let size = bytes;
  let unitIdx = 0;
  while (size >= 1024 && unitIdx < units.length - 1) {
    size /= 1024;
    unitIdx++;
  }
  return size.toFixed(1) + ' ' + units[unitIdx];
}

function userFilesPreviewURL(type, file) {
  return '/user_files/preview?type=' + encodeURIComponent(type) + '&path=' + encodeURIComponent(file.relative_path);
}

function dataForType(type) {
  const dataByType = { memory: MEMORY_DATA, skills: SKILLS_DATA, "skill-state": SKILL_STATE_DATA };
  return dataByType[type] || MEMORY_DATA;
}

function normalizeRelativePath(path) {
  const parts = [];
  String(path || '').replace(/\\/g, '/').split('/').forEach(part => {
    if (!part || part === '.') return;
    if (part === '..') {
      if (parts.length > 0) parts.pop();
      return;
    }
    parts.push(part);
  });
  return parts.join('/');
}

function dirname(path) {
  const normalized = normalizeRelativePath(path);
  const idx = normalized.lastIndexOf('/');
  return idx >= 0 ? normalized.slice(0, idx) : '';
}

function findFileByRelativePath(type, relativePath) {
  const data = dataForType(type);
  const normalized = normalizeRelativePath(relativePath);
  return (data.files || []).find(file => normalizeRelativePath(file.relative_path) === normalized) || null;
}

function findScreenshotFile(type, eventFile, screenshotRef) {
  const data = dataForType(type);
  const ref = String(screenshotRef || '').trim();
  if (!ref) return null;

  const candidates = [];

  if (data.path && ref.indexOf(data.path) === 0) {
    candidates.push(normalizeRelativePath(ref.slice(data.path.length)));
  }

  const baseDir = dirname(eventFile.relative_path);
  if (baseDir) {
    candidates.push(normalizeRelativePath(baseDir + '/' + ref));
  }
  const normalizedRef = normalizeRelativePath(ref);
  if (normalizedRef) candidates.push(normalizedRef);

  for (const candidate of candidates) {
    const file = findFileByRelativePath(type, candidate);
    if (file) return file;
  }
  return null;
}

function attachImageErrorHandlers(scope) {
  const root = scope || document;
  root.querySelectorAll('.image-preview-img').forEach(img => {
    const handleError = () => {
      img.hidden = true;
      const error = img.parentElement.querySelector('.image-preview-error');
      if (error) error.hidden = false;
    };
    img.addEventListener('error', handleError);
    if (img.complete && img.naturalWidth === 0) {
      handleError();
    }
  });
}

function renderImagePreviewBlock(fileType, imageFile) {
  let html = '<div class="block"><div class="block-head"><strong>Image Preview</strong><span>' + esc(imageFile.mime_type || 'image') + '</span></div>';
  html += '<div class="image-preview-body">';
  if (window.location.protocol === 'file:') {
    html += '<div class="image-preview-note">Image preview is available when this report is opened through the Agent HTTP UI.</div>';
  } else {
    html += '<div class="image-preview-frame">';
    html += '<img class="image-preview-img" src="' + esc(userFilesPreviewURL(fileType, imageFile)) + '" alt="' + esc(imageFile.relative_path) + '">';
    html += '<div class="image-preview-error" hidden>Image preview failed to load.</div>';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function screenshotRefLinkHTML(fileType, file, screenshotRef) {
  return '<a href="#" class="screenshot-ref-link" data-type="' + esc(fileType) + '" data-file-path="' + esc(file.relative_path) + '" data-screenshot-ref="' + esc(screenshotRef) + '">' + esc(screenshotRef) + '</a>';
}

function renderContentLineText(fileType, file, text) {
  const source = String(text || '');
  const pattern = /(\\"screenshot_ref\\"\s*:\s*\\")([^"\\]+)(\\")|("screenshot_ref"\s*:\s*")([^"]+)(")|(\bscreenshot_ref\s*:\s*)(["']?)([^"'\s,}]+)(["']?)/g;
  let html = '';
  let lastIndex = 0;
  let match;

  while ((match = pattern.exec(source)) !== null) {
    html += esc(source.slice(lastIndex, match.index));
    if (match[2] !== undefined) {
      html += esc(match[1]) + screenshotRefLinkHTML(fileType, file, match[2]) + esc(match[3]);
    } else if (match[5] !== undefined) {
      html += esc(match[4]) + screenshotRefLinkHTML(fileType, file, match[5]) + esc(match[6]);
    } else {
      html += esc(match[7]) + esc(match[8]) + screenshotRefLinkHTML(fileType, file, match[9]) + esc(match[10]);
    }
    lastIndex = pattern.lastIndex;
  }
  html += esc(source.slice(lastIndex));
  return html || '&nbsp;';
}

function collectContentLines(content, start, limit) {
  const source = String(content || '');
  const lines = [];
  let lineStart = start || 0;
  for (let i = lineStart; i < source.length; i++) {
    if (source.charCodeAt(i) !== 10) continue;
    lines.push(source.slice(lineStart, i));
    lineStart = i + 1;
    if (limit > 0 && lines.length >= limit) {
      return { lines, nextStart: lineStart, hasMore: lineStart < source.length };
    }
  }
  lines.push(source.slice(lineStart));
  return { lines, nextStart: source.length, hasMore: false };
}

function renderContentLineElements(fileType, file, lines, startLine) {
  let html = '';
  lines.forEach((line, idx) => {
    html += '<div class="content-line">';
    html += '<span class="content-line-no">' + String(startLine + idx).padStart(3, '0') + '</span>';
    html += '<code class="content-line-text">' + renderContentLineText(fileType, file, line) + '</code>';
    html += '</div>';
  });
  return html;
}

function renderContentLines(fileType, file) {
  const first = collectContentLines(file.content, 0, CONTENT_INITIAL_LINE_LIMIT);
  let html = '<div class="block-body content-lines">';
  html += renderContentLineElements(fileType, file, first.lines, 1);
  if (first.hasMore) {
    html += '<div class="content-more">';
    html += '<span>Showing first ' + first.lines.length + ' lines.</span>';
    html += '<button class="content-more-btn" data-type="' + esc(fileType) + '" data-file-path="' + esc(file.relative_path) + '" data-next-start="' + first.nextStart + '" data-next-line="' + (first.lines.length + 1) + '">Render remaining lines</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function attachContentMoreListeners(scope) {
  const root = scope || document;
  root.querySelectorAll('.content-more-btn').forEach(btn => {
    if (btn.dataset.listenerAttached === "true") return;
    btn.dataset.listenerAttached = "true";
    btn.addEventListener('click', event => {
      event.preventDefault();
      const fileType = btn.dataset.type;
      const file = findFileByRelativePath(fileType, btn.dataset.filePath);
      if (!file) return;
      const start = parseInt(btn.dataset.nextStart, 10);
      const startLine = parseInt(btn.dataset.nextLine, 10);
      const remaining = collectContentLines(file.content, Number.isFinite(start) ? start : 0, 0);
      const wrapper = btn.closest('.content-more');
      wrapper.insertAdjacentHTML('beforebegin', renderContentLineElements(fileType, file, remaining.lines, Number.isFinite(startLine) ? startLine : 1));
      wrapper.remove();
      attachScreenshotRefListeners(root);
    });
  });
}

function attachScreenshotRefListeners(scope) {
  const root = scope || document;
  root.querySelectorAll('.screenshot-ref-link').forEach(link => {
    if (link.dataset.listenerAttached === "true") return;
    link.dataset.listenerAttached = "true";
    link.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      const fileType = link.dataset.type;
      const eventFile = findFileByRelativePath(fileType, link.dataset.filePath);
      openScreenshotDetailDrawer(fileType, eventFile, link.dataset.screenshotRef, link);
    });
  });
}

function openScreenshotDetailDrawer(fileType, eventFile, screenshotRef, trigger) {
  detailDrawerTrigger = trigger || null;
  const imageFile = eventFile ? findScreenshotFile(fileType, eventFile, screenshotRef) : null;
  document.getElementById("detailTitle").textContent = screenshotRef || "Screenshot";

  let chips = '<span class="chip">screenshot_ref</span>';
  if (imageFile) {
    chips += '<span class="chip">' + formatSize(imageFile.size) + '</span>';
    chips += '<span class="chip">' + imageFile.modified + '</span>';
    if (imageFile.mime_type) chips += '<span class="chip">' + esc(imageFile.mime_type) + '</span>';
  } else {
    chips += '<span class="chip">not found</span>';
  }
  document.getElementById("detailChips").innerHTML = chips;

  let body = '';

function renderMemoryContent() {
  const files = MEMORY_DATA.files || [];

  if (files.length === 0) {
    document.getElementById("memory-content").innerHTML = '<section class="panel"><div class="empty-state">No memory files found at ' + esc(MEMORY_DATA.path) + '</div></section>';
    return;
  }

  // Group files by directory
  const dirTree = {};
  files.forEach((file, idx) => {
    file._index = idx;
    const parts = file.relative_path.split('/');
    if (parts.length > 1) {
      const dir = parts.slice(0, -1).join('/');
      if (!dirTree[dir]) dirTree[dir] = [];
      dirTree[dir].push(file);
    } else {
      if (!dirTree['_root']) dirTree['_root'] = [];
      dirTree['_root'].push(file);
    }
  });

  let html = '<section class="panel">';
  html += '<div class="panel-header">';
  html += '<div><h3 class="panel-title">Memory Directory</h3><span style="color:var(--muted);font-size:11px;font-family:var(--font-mono)">' + esc(MEMORY_DATA.path) + '</span></div>';
  html += '<div style="display:flex;gap:6px"><button class="toggle-all-btn" data-target="memory-content" data-state="expanded" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:11px">Collapse All</button></div>';
  html += '</div>';

  // Sort directories
  const sortedDirs = Object.keys(dirTree).sort((a, b) => {
    if (a === '_root') return -1;
    if (b === '_root') return 1;
    return a.localeCompare(b);
  });

  sortedDirs.forEach(dir => {
    const dirFiles = dirTree[dir];
    if (dir === '_root') {
      html += '<ul class="file-list">';
    } else {
      html += '<div class="dir-header" data-dir="' + esc(dir) + '">';
      html += '<span class="dir-icon">▼</span>';
      html += '<span class="dir-folder-icon">📁</span>';
      html += '<span class="dir-name">' + esc(dir) + '</span>';
      html += '<span class="dir-count">' + dirFiles.length + ' files</span>';
      html += '</div>';
      html += '<ul class="file-list" data-dir-list="' + esc(dir) + '">';
    }

    dirFiles.forEach(file => {
      const filename = file.relative_path.split('/').pop();
      html += '<li class="file-item" data-type="memory" data-idx="' + file._index + '">';
      html += '<div><div class="file-name">' + esc(filename);
      if (file.is_hidden) html += '<span class="badge hidden">hidden</span>';
      if (file.type === 'text') html += '<span class="badge text">text</span>';
      if (file.type === 'image') html += '<span class="badge image">image</span>';
      if (file.json) html += '<span class="badge json">json</span>';
      if (file.jsonl) html += '<span class="badge" style="background:color-mix(in oklch,oklch(58% 0.18 150) 8%,white);border-color:color-mix(in oklch,oklch(58% 0.18 150) 32%,var(--border));color:oklch(58% 0.18 150)">jsonl</span>';
      if (file.references && file.references.length > 0) {
        html += '<span class="badge" style="background:color-mix(in oklch,var(--accent) 8%,white);border-color:color-mix(in oklch,var(--accent) 32%,var(--border));color:var(--accent)">' + file.references.length + ' refs</span>';
      }
      html += '</div><div class="file-meta">' + formatSize(file.size) + ' &middot; ' + file.modified + '</div></div>';
      html += '<span style="color:var(--muted);font-size:11px">' + formatSize(file.size) + '</span>';
      html += '</li>';
    });

    html += '</ul>';
  });

  html += '</section>';
  document.getElementById("memory-content").innerHTML = html;
  attachFileListeners();
  attachDirToggle('memory-content');
}

function attachDirToggle(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  // Attach dir-header click handlers
  container.querySelectorAll('.dir-header').forEach(header => {
    header.addEventListener('click', () => {
      const dir = header.dataset.dir;
      const list = container.querySelector('[data-dir-list="' + dir + '"]');
      if (list) {
        header.classList.toggle('collapsed');
        list.classList.toggle('collapsed');
      }
    });
  });

  // Attach toggle-all button handler
  const btn = container.querySelector('.toggle-all-btn');
  if (btn) {
    // Remove old listener if exists (clone and replace)
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);

    newBtn.addEventListener('click', () => {
      const state = newBtn.dataset.state;
      const headers = container.querySelectorAll('.dir-header');
      const lists = container.querySelectorAll('[data-dir-list]');

      if (state === 'expanded') {
        headers.forEach(h => h.classList.add('collapsed'));
        lists.forEach(l => l.classList.add('collapsed'));
        newBtn.dataset.state = 'collapsed';
        newBtn.textContent = 'Expand All';
      } else {
        headers.forEach(h => h.classList.remove('collapsed'));
        lists.forEach(l => l.classList.remove('collapsed'));
        newBtn.dataset.state = 'expanded';
        newBtn.textContent = 'Collapse All';
      }
    });
  }
}

function attachFileListeners() {
  document.querySelectorAll(".file-item").forEach(item => {
    item.addEventListener("click", () => {
      const type = item.dataset.type;
      const idx = parseInt(item.dataset.idx);
      openDrawer(type, idx);
    });
  });
}

function openDrawer(type, idx) {
  closeDetailDrawer({ restoreFocus: false });
  const data = dataForType(type);
  const file = data.files[idx];

  document.getElementById("dTitle").textContent = file.relative_path;

  let chips = '<span class="chip">' + formatSize(file.size) + '</span>';
  chips += '<span class="chip">' + file.modified + '</span>';
  if (file.is_hidden) chips += '<span class="chip">hidden</span>';
  if (file.type) chips += '<span class="chip">' + file.type + '</span>';
  if (file.mime_type) chips += '<span class="chip">' + esc(file.mime_type) + '</span>';
  document.getElementById("dChips").innerHTML = chips;

  let body = '';
  body += '<div class="block"><div class="block-head"><strong>File Path</strong></div><pre class="block-body">' + esc(file.path) + '</pre></div>';

  if (file.type === 'image') {
    body += renderImagePreviewBlock(type, file);
  }

  if (file.json) {
    body += '<div class="block"><div class="block-head"><strong>JSON Data</strong><span>parsed</span></div><pre class="block-body">' + esc(JSON.stringify(file.json, null, 2)) + '</pre></div>';
  }

  if (file.jsonl) {
    body += '<div class="block"><div class="block-head"><strong>JSONL Data</strong><span>' + file.jsonl_count + ' lines</span></div>';
    body += '<div class="block-body" style="display:flex;flex-direction:column;gap:8px;max-height:500px;overflow-y:auto">';
    file.jsonl.forEach((line, idx) => {
      body += '<details style="border:1px solid var(--border);border-radius:8px;padding:8px">';
      body += '<summary style="cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);user-select:none">Line ' + (idx + 1) + '</summary>';
      body += '<pre style="margin-top:8px;font-size:11px;overflow-x:auto;max-height:300px;overflow-y:auto">' + esc(JSON.stringify(line, null, 2)) + '</pre>';
      body += '</details>';
    });
    body += '</div></div>';
  }

  if (file.content) {
    const contentMeta = file.jsonl_count ? file.jsonl_count + ' parsed lines' : formatSize(file.size);
    body += '<div class="block"><div class="block-head"><strong>Content</strong><span>' + contentMeta + '</span></div>' + renderContentLines(type, file) + '</div>';
  } else if (file.type === 'binary') {
    body += '<div class="block"><div class="block-head"><strong>Binary File</strong></div><div class="block-body">Cannot display binary content</div></div>';
  }

  // Display references
  if (file.references && file.references.length > 0) {
    let refsHtml = '<div style="display:flex;flex-direction:column;gap:8px">';
    file.references.forEach(ref => {
      const typeColors = {
        'episode': 'var(--accent)',
        'procedure': 'var(--accent-purple)',
        'app': 'oklch(58% 0.18 150)',
        'failure': 'oklch(58% 0.18 28)'
      };
      const color = typeColors[ref.type] || 'var(--muted)';
      refsHtml += '<div style="padding:8px;border:1px solid var(--border);border-radius:8px;display:flex;justify-content:space-between;align-items:center">';
      refsHtml += '<div><span style="font-size:10px;color:' + color + ';text-transform:uppercase;font-weight:700">' + esc(ref.type) + '</span>';
      refsHtml += '<div style="font-family:var(--font-mono);font-size:12px;margin-top:2px">' + esc(ref.id) + '</div>';
      refsHtml += '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + esc(ref.path) + '</div></div>';
      refsHtml += '<button class="ref-jump-btn" data-path="' + esc(ref.path) + '" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:11px">Jump</button>';
      refsHtml += '</div>';
    });
    refsHtml += '</div>';
    body += '<div class="block"><div class="block-head"><strong>References</strong><span>' + file.references.length + ' found</span></div><div class="block-body">' + refsHtml + '</div></div>';
  }

  document.getElementById("dBody").innerHTML = body;

  attachImageErrorHandlers(document.getElementById("dBody"));
  attachContentMoreListeners(document.getElementById("dBody"));
  attachScreenshotRefListeners(document.getElementById("dBody"));

  // Add event listeners for reference jump buttons
  document.querySelectorAll('.ref-jump-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const targetPath = btn.dataset.path;
      jumpToFile(targetPath);
    });
  });

  document.body.classList.add("open");
}

function jumpToFile(targetPath) {
  // Try to find matching file in current tab
  const currentTab = document.querySelector('.tab.active').dataset.tab;
  const data = dataForType(currentTab);

  // Handle wildcard paths like "episodes/*/ep_xxx/*"
  const pathPattern = targetPath.replace(/\*/g, '.*');
  const regex = new RegExp('^' + pathPattern + '$');

  for (let i = 0; i < data.files.length; i++) {
    const file = data.files[i];
    if (regex.test(file.relative_path)) {
      closeDrawer();
      setTimeout(() => {
        const fileItem = document.querySelector('.file-item[data-type="' + currentTab + '"][data-idx="' + i + '"]');
        if (fileItem) {
          fileItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
          fileItem.style.background = 'color-mix(in oklch, var(--accent) 12%, white)';
          setTimeout(() => {
            fileItem.style.background = '';
          }, 2000);
          fileItem.click();
        }
      }, 300);
      return;
    }
  }

  // If not found, show message
  alert('Referenced file not found in current directory: ' + targetPath);
}

function closeDetailDrawer(options) {
  const restoreFocus = !options || options.restoreFocus !== false;
  document.body.classList.remove("detail-open");
  detailDrawer.setAttribute("inert", "");
  detailDrawer.setAttribute("aria-hidden", "true");
  if (restoreFocus && detailDrawerTrigger && detailDrawerTrigger.isConnected) {
    detailDrawerTrigger.focus({ preventScroll: true });
  }
  detailDrawerTrigger = null;
}

function closeDrawer() {
  closeDetailDrawer({ restoreFocus: false });
  document.body.classList.remove("open");
}

// Tab switching
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    const target = tab.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(target + "-content").classList.add("active");
  });
});

backdrop.addEventListener("click", closeDrawer);
closeBtn.addEventListener("click", closeDrawer);
detailCloseBtn.addEventListener("click", closeDetailDrawer);
window.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.body.classList.contains("detail-open")) {
    closeDetailDrawer();
  } else {
    closeDrawer();
  }
});
