[project]
name = "aiden-skillopt"
version = "0.1.0"
description = "Independent SkillOpt workflow for optimizing Aiden skills"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "requests>=2.31.0",
    "tenacity>=8.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../benchmark"]
