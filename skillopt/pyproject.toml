[project]
name = "aiden-skillopt"
version = "0.1.0"
description = "Independent SkillOpt workflow for optimizing Aiden skills"
requires-python = ">=3.10"
dependencies = [
    # SkillOpt imports the benchmark runner as its execution backend. Keep the
    # runner's runtime dependencies in this environment so `uv run pytest`
    # does not depend on whichever packages happen to be installed on the host.
    "aiofiles>=23.2.1",
    "anthropic>=0.18.0",
    "langfuse==4.15.4",
    "openai>=1.12.0",
    "pillow>=10.2.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "tenacity>=8.2.3",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../benchmark"]
