services:
  aiden:
    image: ${AIDEN_DOCKER_IMAGE:-aiden-agent-sandbox:local}
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${AIDEN_CONFIG_WEB_PORT:-8000}:80"
      - "127.0.0.1:${AIDEN_AGENT_WEB_PORT:-8080}:8080"
    volumes:
      - aiden-data:/userdata
    environment:
      AIDEN_ENVIRONMENT_BRIDGE_ENDPOINT: ${AIDEN_ENVIRONMENT_BRIDGE_ENDPOINT:-}
      ENVIRONMENT_BRIDGE_ENDPOINT: ${ENVIRONMENT_BRIDGE_ENDPOINT:-}
      AIDEN_ENVIRONMENT_BRIDGE_MODE: ${AIDEN_ENVIRONMENT_BRIDGE_MODE:-auto}
      AIDEN_ENVIRONMENT_BRIDGE_TOOLS: ${AIDEN_ENVIRONMENT_BRIDGE_TOOLS:-screenshot,touch_gesture,keyboard_text,keyboard_tap,enter_text,search_launch_app,mouse_move,mouse_scroll,quick_action,bridge_open_app,bridge_clipboard,bridge_calendar,bridge_contacts,bridge_notification}
      AIDEN_BENCHMARK_TASK_ID: ${AIDEN_BENCHMARK_TASK_ID:-docker-sandbox}
      AIDEN_BRIDGE_EPISODE_ID: ${AIDEN_BRIDGE_EPISODE_ID:-docker-sandbox}
      AIDEN_DEVICE_TYPE: ${AIDEN_DEVICE_TYPE:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null && curl -fsS http://127.0.0.1:8080/api/tools >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  aiden-data:
