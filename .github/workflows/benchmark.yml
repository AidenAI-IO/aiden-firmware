name: Recover Benchmark Results

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/recover-memory-benchmark-results' }}
    runs-on: aiden-hosted-01
    timeout-minutes: 5
    steps:
      - name: Read retained memory benchmark report
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          import textwrap
          from pathlib import Path

          run = Path(os.environ['GITHUB_WORKSPACE']) / 'benchmark/runs/ci-37908250106-1-memory'
          for name in ('summary.md', 'metrics.json'):
              print(f'=== {name} ===', flush=True)
              print((run / name).read_text(), flush=True)
          print('=== REPORT_BASE64_GZIP_BEGIN ===', flush=True)
          payload = base64.b64encode(gzip.compress((run / 'report.html').read_bytes())).decode('ascii')
          for line in textwrap.wrap(payload, 120):
              print(line, flush=True)
          print('=== REPORT_BASE64_GZIP_END ===', flush=True)
          PY
