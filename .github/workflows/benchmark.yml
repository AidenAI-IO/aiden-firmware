name: Benchmark

on:
  push:
    branches:
      - feat/benchmark-ci
  schedule:
    # 02:17 Asia/Shanghai on Monday, Wednesday, and Friday.
    - cron: '17 18 * * 0,2,4'
  workflow_dispatch:
    inputs:
      profile:
        description: Suite profile
        required: true
        default: runnable
        type: choice
        options:
          - runnable
          - hardware
          - all
      suite:
        description: Optional suite path, for example suites/memory_v1.json
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      profile: ${{ steps.profile.outputs.profile }}
      timeout_minutes: ${{ steps.profile.outputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: profile
        name: Select scheduled profile
        env:
          DISPATCH_PROFILE: ${{ inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${DISPATCH_PROFILE:-runnable}"
          elif [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "push" ]]; then
            profile="runnable"
          else
            echo "Unsupported benchmark workflow event: $EVENT_NAME" >&2
            exit 1
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          case "$profile" in
            runnable) timeout_minutes=1440 ;;
            hardware) timeout_minutes=4320 ;;
            all) timeout_minutes=5760 ;;
            *) echo "Unsupported benchmark profile: $profile" >&2; exit 1 ;;
          esac
          echo "timeout_minutes=$timeout_minutes" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Build suite matrix
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [[ -n "$SUITE" ]]; then
            matrix="$(python3 benchmark/ci/plan.py matrix --profile "$PROFILE" --suite "$SUITE")"
          else
            matrix="$(python3 benchmark/ci/plan.py matrix --profile "$PROFILE")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Summarize plan
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          cases = json.loads(os.environ["MATRIX"])["include"]
          print(f"## Benchmark plan: {os.environ['PROFILE']}")
          print(f"\n{len(cases)} case(s): " + ", ".join(case["id"] for case in cases))
          PY

  run:
    needs: plan
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: aiden-hosted-01
    # One runner serves this label, so a job matrix could never start a second job:
    # every case ran back to back and repaid the checkout/uv/docker setup 13 times.
    # A single job fans the cases out in-process instead, where the isolation that
    # already exists (per-RUN_ID container names, dynamically allocated ports) is
    # what makes them safe to overlap. Per-case timeouts live in the driver; the
    # profile-level ceiling only prevents an unexpectedly stuck batch.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
    env:
      MATRIX: ${{ needs.plan.outputs.matrix }}
      BENCHMARK_CI_MAX_PARALLEL: '2'
      BENCHMARK_AGENT_PROVIDER: ${{ vars.BENCHMARK_AGENT_PROVIDER }}
      DOCKER_BUILDKIT: 1
      BENCHMARK_AGENT_MODEL: ${{ vars.BENCHMARK_AGENT_MODEL }}
      BENCHMARK_AGENT_BASE_URL: ${{ vars.BENCHMARK_AGENT_BASE_URL }}
      BENCHMARK_AGENT_API_KEY: ${{ secrets.BENCHMARK_AGENT_API_KEY }}
      BENCHMARK_JUDGE_MODEL: ${{ vars.BENCHMARK_JUDGE_MODEL || 'anthropic/claude-sonnet-4-6' }}
      BENCHMARK_JUDGE_BASE_URL: ${{ vars.BENCHMARK_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
      BENCHMARK_JUDGE_API_KEY: ${{ secrets.BENCHMARK_JUDGE_API_KEY }}
      DAEMON_IMAGE: ${{ vars.DAEMON_IMAGE || 'aiden-agent-daemon:local' }}
      DAEMON_DOCKERFILE: benchmark/docker/Dockerfile.agent-daemon.cn
      MOBILEGYM_IMAGE: aiden-mobilegym-simulator:py311
      MOBILEGYM_NODE_IMAGE: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:22-bookworm
      MOBILEGYM_DEBIAN_MIRROR: repo.huaweicloud.com
      BENCHMARK_CI_IMAGES_PREPARED: '1'
      PREPARE_LOG: runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-prepare-images/mobilegym-image.log
      # The runner reaches openrouter.ai, the Cloudflare-fronted Langfuse host and
      # GitHub artifact storage through this proxy. Only https is proxied because all
      # three endpoints are https. Docker builds never inherit it; daemon_compose_env
      # strips proxy variables so the huaweicloud mirrors keep resolving directly.
      # Actions treats env keys case-insensitively, so declaring both spellings is a
      # duplicate-key error. Lowercase is the portable one: urllib and libcurl accept
      # either, while some tools only read lowercase.
      https_proxy: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal
      # A publish that cannot reach Langfuse must not burn the default 11 minutes.
      LANGFUSE_PUBLISH_VERIFY_TIMEOUT_SECONDS: '90'
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      ANDROID_SERIAL: ${{ vars.ANDROID_SERIAL }}
      BENCHMARK_PHONE_ENVIRONMENT_URL: ${{ vars.BENCHMARK_PHONE_ENVIRONMENT_URL }}
      BENCHMARK_IOS_ENVIRONMENT_URL: ${{ vars.BENCHMARK_IOS_ENVIRONMENT_URL }}
      BENCHMARK_MAC_ENVIRONMENT_URL: ${{ vars.BENCHMARK_MAC_ENVIRONMENT_URL }}
      BENCHMARK_VPHONE_ENVIRONMENT_URL: ${{ vars.BENCHMARK_VPHONE_ENVIRONMENT_URL }}
      BENCHMARK_AIDEN_APP_IOS_ENVIRONMENT_URL: ${{ vars.BENCHMARK_AIDEN_APP_IOS_ENVIRONMENT_URL }}
      BENCHMARK_AIDEN_APP_ANDROID_ENVIRONMENT_URL: ${{ vars.BENCHMARK_AIDEN_APP_ANDROID_ENVIRONMENT_URL }}
    steps:
      - name: Reclaim persistent runner workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$owner" "$GITHUB_WORKSPACE"
            elif [[ "$(id -u)" == "0" ]]; then
              chown -R "$owner" "$GITHUB_WORKSPACE"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reap orphaned benchmark containers and run directories
        # Every other cleanup is keyed to this job's RUN_ID, so a cancelled job or a
        # SIGKILLed runner leaks containers and run directories that nothing collects.
        # Sweep by prefix and age instead. The threshold is past the longest suite
        # timeout (360 min), so another active benchmark is never touched.
        continue-on-error: true
        env:
          REAP_AGE_HOURS: '8'
        run: |
          set -uo pipefail
          cutoff=$(( $(date +%s) - REAP_AGE_HOURS * 3600 ))
          for prefix in aiden-benchmark-agent- aiden-mobilegym-env-; do
            for id in $(docker ps -aq --filter "name=$prefix"); do
              # .Created is plain RFC3339. `docker ps --format CreatedAt` instead ends
              # in a timezone abbreviation that GNU date refuses to parse.
              created="$(docker inspect -f '{{.Created}}' "$id" 2>/dev/null)" || continue
              [[ -n "$created" ]] || continue
              created_epoch="$(date -d "$created" +%s 2>/dev/null)" || continue
              if (( created_epoch < cutoff )); then
                name="$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null)"
                echo "Reaping stale container ${name#/} (created $created)"
                docker rm -f "$id" >/dev/null 2>&1 || true
              fi
            done
          done
          for id in $(docker network ls -q --filter "label=com.docker.compose.project"); do
            project="$(docker network inspect -f '{{ index .Labels "com.docker.compose.project" }}' "$id" 2>/dev/null)" || continue
            [[ "$project" == aiden-benchmark-agent-* ]] || continue
            created="$(docker network inspect -f '{{.Created}}' "$id" 2>/dev/null)" || continue
            created_epoch="$(date -d "$created" +%s 2>/dev/null)" || continue
            if (( created_epoch < cutoff )); then
              echo "Reaping stale Compose network $project (created $created)"
              docker network rm "$id" >/dev/null 2>&1 || true
            fi
          done
          # Artifacts live on GitHub and traces in Langfuse, so old run directories are
          # redundant locally. cli-services is shared across runs, not a run directory.
          if [[ -d benchmark/runs ]]; then
            find benchmark/runs -mindepth 1 -maxdepth 1 -type d \
              -not -name cli-services \
              -mmin "+$(( REAP_AGE_HOURS * 60 ))" \
              -print -exec rm -rf {} + 2>/dev/null || true
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Install Python and benchmark dependencies
        working-directory: benchmark
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12
      - name: Install Docker Compose V2
        run: |
          set -euo pipefail
          # Check if docker compose plugin is already available
          if docker compose version >/dev/null 2>&1; then
            echo "Docker Compose V2 is already installed"
            docker compose version
            exit 0
          fi

          # Install docker compose V2 plugin manually without sudo
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose

          # Verify installation
          docker compose version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Validate benchmark credentials
        env:
          REQUIRED_VALUES: >-
            BENCHMARK_AGENT_PROVIDER
            BENCHMARK_AGENT_MODEL
            BENCHMARK_AGENT_BASE_URL
            BENCHMARK_AGENT_API_KEY
            BENCHMARK_JUDGE_API_KEY
            LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY
            LANGFUSE_BASE_URL
        run: |
          set -euo pipefail
          missing=()
          for name in $REQUIRED_VALUES; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing benchmark configuration: ${missing[*]}" >&2
            exit 1
          fi
      - name: Validate Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker info
      - name: Prepare benchmark images
        working-directory: benchmark
        run: >-
          uv run python -m ci.prepare_images
          --matrix-json "$MATRIX"
          --daemon-image "$DAEMON_IMAGE"
          --daemon-dockerfile "$DAEMON_DOCKERFILE"
          --mobilegym-image "$MOBILEGYM_IMAGE"
          --mobilegym-log "$PREPARE_LOG"
      - name: Run benchmark cases
        working-directory: benchmark
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUN_ID_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          uv run python -m ci.run_cases
          --matrix-json "$MATRIX"
          --run-id-prefix "$RUN_ID_PREFIX"
          --max-parallel "$BENCHMARK_CI_MAX_PARALLEL"
      - name: Clean up benchmark services
        if: ${{ always() }}
        env:
          RUN_ID_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # Every run id in this job starts with the prefix, so one prefix sweep
          # covers all the cases the fan-out started.
          for id in $(docker ps -aq --filter "name=aiden-mobilegym-env-mobilegym-${RUN_ID_PREFIX}"); do
            docker rm -f "$id" >/dev/null 2>&1 || true
          done
          for id in $(docker ps -aq --filter "name=aiden-benchmark-agent-${RUN_ID_PREFIX}"); do
            project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$id" 2>/dev/null)"
            if [[ -n "$project" ]]; then
              docker compose \
                -f benchmark/docker/docker-compose.agent-daemon.yml \
                -p "$project" down --volumes --remove-orphans \
                >/dev/null 2>&1 || true
            fi
            docker rm -f "$id" >/dev/null 2>&1 || true
          done
          for pid_file in benchmark/runs/cli-services/adb-android-"${RUN_ID_PREFIX}"*/adb-android.pid; do
            [[ -s "$pid_file" ]] || continue
            kill -TERM "$(cat "$pid_file")" >/dev/null 2>&1 || true
          done
      - name: Publish completed runs to Langfuse
        if: ${{ always() }}
        # Observability is a side channel: a publish failure must not mask the
        # benchmark verdict this job exists to report.
        continue-on-error: true
        working-directory: benchmark
        env:
          RUN_ID_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          attempted=0
          succeeded=0
          failed=0
          for manifest in runs/"${RUN_ID_PREFIX}"-*/manifest.json; do
            [[ -f "$manifest" ]] || continue
            run_dir="$(dirname "$manifest")"
            echo "::group::publish $(basename "$run_dir")"
            if uv run python -m runner publish-langfuse --run-dir "$run_dir"; then
              succeeded=$((succeeded + 1))
            else
              failed=$((failed + 1))
              echo "::warning::Langfuse publication failed for $(basename "$run_dir")"
            fi
            echo "::endgroup::"
            attempted=$((attempted + 1))
          done
          if (( attempted == 0 )); then
            echo "::warning::No completed manifest under ${RUN_ID_PREFIX}-*; skipping Langfuse publication"
          fi
          publication_summary="Langfuse publication: $attempted attempted, $succeeded succeeded, $failed failed"
          echo "::notice::$publication_summary"
          echo "$publication_summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifacts
        id: upload_benchmark_artifacts
        if: ${{ always() }}
        # No downstream job consumes these; a blob-storage hiccup must not turn a
        # passing benchmark into a failed job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/${{ env.PREPARE_LOG }}
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/manifest.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/metrics.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/results.jsonl
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/summary.md
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/report.html
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/suite.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/auto-agent-setup.log
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/ci-case.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Retry benchmark artifact upload
        if: ${{ always() && steps.upload_benchmark_artifacts.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/${{ env.PREPARE_LOG }}
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/manifest.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/metrics.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/results.jsonl
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/summary.md
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/report.html
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/suite.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/auto-agent-setup.log
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-*/ci-case.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
          overwrite: true
