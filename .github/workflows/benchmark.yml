name: Benchmark

on:
  push:
    branches:
      - feat/benchmark-ci
  schedule:
    # 02:17 Asia/Shanghai on Monday, Wednesday, and Friday.
    - cron: '17 18 * * 0,2,4'
  workflow_dispatch:
    inputs:
      profile:
        description: Suite profile
        required: true
        default: runnable
        type: choice
        options:
          - runnable
          - hardware
          - all
      suite:
        description: Optional suite path, for example suites/memory_v1.json
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: profile
        name: Select scheduled profile
        env:
          DISPATCH_PROFILE: ${{ inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${DISPATCH_PROFILE:-runnable}"
          elif [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "push" ]]; then
            profile="runnable"
          else
            echo "Unsupported benchmark workflow event: $EVENT_NAME" >&2
            exit 1
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Build suite matrix
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [[ -n "$SUITE" ]]; then
            matrix="$(python3 benchmark/ci/plan.py matrix --profile "$PROFILE" --suite "$SUITE")"
          else
            matrix="$(python3 benchmark/ci/plan.py matrix --profile "$PROFILE")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Summarize plan
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          cases = json.loads(os.environ["MATRIX"])["include"]
          print(f"## Benchmark plan: {os.environ['PROFILE']}")
          print(f"\n{len(cases)} case(s): " + ", ".join(case["id"] for case in cases))
          PY

  prepare-images:
    needs: plan
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: aiden-hosted-01
    timeout-minutes: 60
    env:
      MATRIX: ${{ needs.plan.outputs.matrix }}
      DAEMON_IMAGE: ${{ vars.DAEMON_IMAGE || 'aiden-agent-daemon:local' }}
      DAEMON_DOCKERFILE: benchmark/docker/Dockerfile.agent-daemon.cn
      MOBILEGYM_IMAGE: aiden-mobilegym-simulator:py311
      MOBILEGYM_NODE_IMAGE: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:22-bookworm
      MOBILEGYM_DEBIAN_MIRROR: repo.huaweicloud.com
      PREPARE_LOG: runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-prepare-images/mobilegym-image.log
    steps:
      - name: Reclaim persistent runner workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$owner" "$GITHUB_WORKSPACE"
            elif [[ "$(id -u)" == "0" ]]; then
              chown -R "$owner" "$GITHUB_WORKSPACE"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Install Python and benchmark dependencies
        working-directory: benchmark
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12
      - name: Install Docker Compose V2
        run: |
          set -euo pipefail
          # Check if docker compose plugin is already available
          if docker compose version >/dev/null 2>&1; then
            echo "Docker Compose V2 is already installed"
            docker compose version
            exit 0
          fi

          # Install docker compose V2 plugin manually without sudo
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose

          # Verify installation
          docker compose version
      - name: Validate Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker info
      - name: Prepare benchmark images
        working-directory: benchmark
        run: >-
          uv run python -m ci.prepare_images
          --matrix-json "$MATRIX"
          --daemon-image "$DAEMON_IMAGE"
          --daemon-dockerfile "$DAEMON_DOCKERFILE"
          --mobilegym-image "$MOBILEGYM_IMAGE"
          --mobilegym-log "$PREPARE_LOG"
      - name: Upload image build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark/${{ env.PREPARE_LOG }}
          if-no-files-found: ignore
          retention-days: 14

  run:
    needs:
      - plan
      - prepare-images
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: aiden-hosted-01
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BENCHMARK_AGENT_PROVIDER: ${{ vars.BENCHMARK_AGENT_PROVIDER }}
      BENCHMARK_AGENT_MODEL: ${{ vars.BENCHMARK_AGENT_MODEL }}
      BENCHMARK_AGENT_BASE_URL: ${{ vars.BENCHMARK_AGENT_BASE_URL }}
      BENCHMARK_AGENT_API_KEY: ${{ secrets.BENCHMARK_AGENT_API_KEY }}
      BENCHMARK_JUDGE_MODEL: ${{ vars.BENCHMARK_JUDGE_MODEL || 'anthropic/claude-sonnet-4-6' }}
      BENCHMARK_JUDGE_BASE_URL: ${{ vars.BENCHMARK_JUDGE_BASE_URL || 'https://openrouter.ai/api/v1' }}
      BENCHMARK_JUDGE_API_KEY: ${{ secrets.BENCHMARK_JUDGE_API_KEY }}
      DAEMON_IMAGE: ${{ vars.DAEMON_IMAGE || 'aiden-agent-daemon:local' }}
      DAEMON_DOCKERFILE: benchmark/docker/Dockerfile.agent-daemon.cn
      MOBILEGYM_NODE_IMAGE: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:22-bookworm
      MOBILEGYM_DEBIAN_MIRROR: repo.huaweicloud.com
      BENCHMARK_CI_IMAGES_PREPARED: '1'
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      ANDROID_SERIAL: ${{ vars.ANDROID_SERIAL }}
      BENCHMARK_PHONE_ENVIRONMENT_URL: ${{ vars.BENCHMARK_PHONE_ENVIRONMENT_URL }}
      BENCHMARK_IOS_ENVIRONMENT_URL: ${{ vars.BENCHMARK_IOS_ENVIRONMENT_URL }}
      BENCHMARK_MAC_ENVIRONMENT_URL: ${{ vars.BENCHMARK_MAC_ENVIRONMENT_URL }}
      BENCHMARK_VPHONE_ENVIRONMENT_URL: ${{ vars.BENCHMARK_VPHONE_ENVIRONMENT_URL }}
      BENCHMARK_AIDEN_APP_IOS_ENVIRONMENT_URL: ${{ vars.BENCHMARK_AIDEN_APP_IOS_ENVIRONMENT_URL }}
      BENCHMARK_AIDEN_APP_ANDROID_ENVIRONMENT_URL: ${{ vars.BENCHMARK_AIDEN_APP_ANDROID_ENVIRONMENT_URL }}
    steps:
      - name: Reclaim persistent runner workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$owner" "$GITHUB_WORKSPACE"
            elif [[ "$(id -u)" == "0" ]]; then
              chown -R "$owner" "$GITHUB_WORKSPACE"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Install Python and benchmark dependencies
        working-directory: benchmark
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12
      - name: Install Docker Compose V2
        run: |
          set -euo pipefail
          # Check if docker compose plugin is already available
          if docker compose version >/dev/null 2>&1; then
            echo "Docker Compose V2 is already installed"
            docker compose version
            exit 0
          fi

          # Install docker compose V2 plugin manually without sudo
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose

          # Verify installation
          docker compose version
      - name: Validate benchmark credentials
        env:
          REQUIRED_VALUES: >-
            BENCHMARK_AGENT_PROVIDER
            BENCHMARK_AGENT_MODEL
            BENCHMARK_AGENT_BASE_URL
            BENCHMARK_AGENT_API_KEY
            BENCHMARK_JUDGE_API_KEY
            LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY
            LANGFUSE_BASE_URL
        run: |
          set -euo pipefail
          missing=()
          for name in $REQUIRED_VALUES; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing benchmark configuration: ${missing[*]}" >&2
            exit 1
          fi
      - name: Validate Docker runtime
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker info
      - name: Run benchmark case
        working-directory: benchmark
        env:
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: uv run python -m ci.run_case --case-id "${{ matrix.id }}" --run-id "$RUN_ID"
      - name: Show benchmark setup log
        if: ${{ failure() }}
        working-directory: benchmark
        env:
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: |
          log="runs/$RUN_ID/auto-agent-setup.log"
          if [[ -f "$log" ]]; then
            echo "::group::auto-agent-setup.log"
            tail -n 400 "$log"
            echo "::endgroup::"
          else
            echo "::warning::No auto-agent setup log found for $RUN_ID"
          fi
      - name: Clean up benchmark services
        if: ${{ always() }}
        env:
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: |
          set -euo pipefail
          for container in \
            "aiden-mobilegym-env-mobilegym-${RUN_ID}" \
            "aiden-benchmark-agent-${RUN_ID}"; do
            docker rm -f "$container" >/dev/null 2>&1 || true
          done
          while read -r container; do
            [[ -z "$container" ]] || docker rm -f "$container" >/dev/null 2>&1 || true
          done < <(docker ps -aq --filter "name=aiden-benchmark-agent-${RUN_ID}-")
          pid_file="benchmark/runs/cli-services/adb-android-${RUN_ID}/adb-android.pid"
          if [[ -s "$pid_file" ]]; then
            kill -TERM "$(cat "$pid_file")" >/dev/null 2>&1 || true
          fi
      - name: Publish completed run to Langfuse
        if: ${{ always() }}
        working-directory: benchmark
        env:
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: |
          set -euo pipefail
          if [[ ! -f "runs/$RUN_ID/manifest.json" ]]; then
            echo "::warning::No completed manifest for $RUN_ID; skipping Langfuse publication"
            exit 0
          fi
          uv run python -m runner publish-langfuse --run-dir "runs/$RUN_ID"
      - name: Add benchmark summary
        if: ${{ always() }}
        working-directory: benchmark
        env:
          RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: |
          if [[ -f "runs/$RUN_ID/summary.md" ]]; then
            cat "runs/$RUN_ID/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/manifest.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/metrics.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/results.jsonl
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/summary.md
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/report.html
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/suite.json
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/auto-agent-setup.log
            benchmark/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/tasks/**
          if-no-files-found: warn
          retention-days: 14
