name: Build MobileGym Docker Images

on:
  # 定时触发（每天一次，避免和主 build-nightly 冲突）
  schedule:
    - cron: '37 4 * * *'  # 每天 UTC 04:37 (与 build-nightly 的 hourly 错开)

  # 手动触发
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: mobilegym-docker-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}/mobilegym

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - name: Skip scheduled run if no MobileGym changes since last release
        id: should_run
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # 手动触发总是构建
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual dispatch; running build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 找最近的 mobilegym-* tag
          LATEST_TAG=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep '^mobilegym-' | head -1 || true)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous mobilegym release; running build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last release tag: $LATEST_TAG"

          # 检查 mobilegym 相关路径自上次 release 是否有改动
          CHANGED=$(git diff --name-only "$LATEST_TAG" HEAD -- \
            'benchmark/mobilegym/**' \
            'src/agent/**' \
            'benchmark/pyproject.toml' \
            'benchmark/uv.lock' \
            '.github/workflows/build-mobilegym-docker.yml' 2>/dev/null | head -1)

          if [ -z "$CHANGED" ]; then
            echo "No MobileGym changes since $LATEST_TAG; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected; running build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Generate release name
        if: steps.should_run.outputs.should_run == 'true'
        id: release_info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          RELEASE_NAME="mobilegym-${TIMESTAMP}-${COMMIT_HASH}"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release name: ${RELEASE_NAME}"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_run == 'true'
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        target: [mobilegym-base, daemon-runtime, test-runner]
        include:
          - target: mobilegym-base
            image_name: simulator
          - target: daemon-runtime
            image_name: daemon
          - target: test-runner
            image_name: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ needs.check.outputs.release_name }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: benchmark/mobilegym/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Image summary
        run: |
          echo "## ${{ matrix.image_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  release:
    runs-on: ubuntu-latest
    needs: [check, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          cat > release_notes.md <<EOF
          # ${{ needs.check.outputs.release_name }}

          MobileGym Docker images built from \`${{ github.sha }}\`.

          ## 📦 Images

          \`\`\`
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-simulator:${{ needs.check.outputs.release_name }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-daemon:${{ needs.check.outputs.release_name }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-test:${{ needs.check.outputs.release_name }}
          \`\`\`

          Or use \`latest\` tag (always points to most recent build):

          \`\`\`
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-simulator:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-daemon:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-test:latest
          \`\`\`

          ## 🚀 Usage

          \`\`\`bash
          cd benchmark/mobilegym/docker
          ./init.sh
          # Edit ../config/agent.toml with your LLM API key

          # Use this version
          TAG=${{ needs.check.outputs.release_name }} \\
            docker compose -f docker-compose.prebuilt.yml pull
          TAG=${{ needs.check.outputs.release_name }} \\
            docker compose -f docker-compose.prebuilt.yml up -d
          \`\`\`

          ## Details

          - Multi-arch: linux/amd64 + linux/arm64
          - Source commit: ${{ github.sha }}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.check.outputs.release_name }}
          tag_name: ${{ needs.check.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          draft: false
          prerelease: false
