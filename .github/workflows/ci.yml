name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch benchmark test fixture submodule
        run: git submodule update --init --depth=1 benchmark/mobilegym/vendor/mobilegym
      - name: Run the full Docker test manifest
        env:
          AIDEN_TEST_JOBS: '2'
        run: make check-full
      - name: Upload Docker test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-summary-${{ github.run_id }}
          path: output/test-summary.json
          if-no-files-found: ignore

  production-smoke:
    needs: manifest-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the production SDK submodule
        run: git submodule update --init --depth=1 pico-sdk
      - name: Run the Dockerized production ARM smoke test
        env:
          AIDEN_TEST_JOBS: '2'
        run: bash scripts/run_tests_in_docker.sh --production --suite production-cross-smoke
      - name: Upload production smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-summary-${{ github.run_id }}
          path: output/test-summary.json
          if-no-files-found: ignore

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Docker sandbox contract
        timeout-minutes: 25
        run: |
          bash scripts/run_tests_in_docker.sh \
            --docker-socket --host-network \
            --suite docker-package-contract \
            --suite docker-sandbox-smoke
      - name: Upload Docker contract summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-contract-summary-${{ github.run_id }}
          path: output/test-summary.json
          if-no-files-found: ignore
