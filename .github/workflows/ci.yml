name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  benchmark-ci-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify every benchmark suite has a CI policy
        run: python3 benchmark/ci/plan.py validate
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: benchmark/uv.lock
      - name: Run benchmark CI planner tests
        working-directory: benchmark
        run: |
          uv sync --frozen --only-group dev
          uv run pytest tests/test_ci_plan.py tests/test_ci_prepare_images.py tests/test_ci_run_cases.py -q

  github-actions-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify self-hosted runner safety
        run: bash scripts/test_github_actions_self_hosted_safety.sh

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # test_debian_only_policy.sh greps active documentation and build paths
      # with ripgrep, which is not guaranteed on every runner image.
      - name: Install Debian-only policy dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Verify Debian-only production policy
        run: bash scripts/test_debian_only_policy.sh
      - name: Verify release scripts
        run: |
          sh scripts/test_release_ci_scripts.sh
          bash scripts/test_rootfs_cli_tool_catalog.sh
          bash scripts/test_clean_rootfs_overlay_staging.sh
          sh scripts/test_build_rootfs_cli_tools.sh
          sh scripts/test_stage_rootfs_cli_tools.sh
          bash scripts/test_compress_release_images.sh
          bash scripts/test_ota_partition_layout.sh
          sh scripts/test_ota_device_config.sh
          bash scripts/test_ota_manifest_generation.sh
          bash scripts/test_github_release_upload.sh
          bash scripts/test_debian_apt_cache.sh
          bash scripts/test_reusable_rootfs_release_asset.sh
      - name: Verify normalized UI coordinates
        run: |
          python3 scripts/check_normalized_coords.py
          bash scripts/test_check_normalized_coords.sh
      - name: Verify application build proxy handling with an inherited GOPROXY
        env:
          GOPROXY: https://inherited.example
          RK_JOBS: '2'
        run: bash scripts/test_debian_apps.sh

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Docker sandbox contract
        timeout-minutes: 25
        run: |
          python3 -m unittest tests.benchmark.test_docker_sandbox
          docker compose config --quiet
          sh scripts/test_docker_sandbox.sh

  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/agent/go.mod
          cache-dependency-path: src/agent/go.sum
      # Host Web UI tests execute JavaScript directly. Declare Node explicitly
      # instead of relying on the runner image to happen to provide it.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run C++ unit tests
        run: |
          sudo apt-get update
          # The host tests only use OpenCV core and imgproc. Installing the
          # libopencv-dev metapackage pulled 199 MB of unrelated modules into
          # every clean runner (Java, stitching, video, contrib, and more).
          # dnsmasq-base keeps the usb0 CTest syntax check from downgrading to
          # a skip, so that contract needs no separate duplicate test step.
          sudo apt-get install -y --no-install-recommends \
            dnsmasq-base \
            libopencv-core-dev \
            libopencv-imgproc-dev
          make test

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/agent/go.mod
          cache-dependency-path: src/agent/go.sum
      - name: Run Go unit tests
        working-directory: src/agent
        run: go test ./...

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Agent Web UI tests
        run: make test-agent-webui
