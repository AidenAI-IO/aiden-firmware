name: Debian Business Package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a business-vVERSION-REVISION prerelease (otherwise artifacts only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: debian-business-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch SDK
        run: git submodule update --init --depth=1 pico-sdk
      - name: Check packaging scripts
        run: |
          bash scripts/test_debian_package.sh
          python3 scripts/test_debian_package_release.py
      - uses: actions/cache@v4
        with:
          path: |
            .toolchains
            .cache/debian-apps
          key: business-armhf-${{ runner.os }}-${{ hashFiles('src/agent/go.sum', 'scripts/debian-apps/Dockerfile', 'scripts/debian-apps/*patch') }}
          restore-keys: business-armhf-${{ runner.os }}-
      - name: Build business package
        env:
          RK_JOBS: '4'
        run: scripts/debian-package/release.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: aiden-business-${{ github.sha }}
          path: output/debian-package/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aiden-business-${{ github.sha }}
          path: output/debian-package/release/
      - name: Publish business prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/debian-package/release.sh publish
