name: Benchmark Langfuse network diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: aiden-hosted-01
    timeout-minutes: 10
    env:
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      https_proxy: ${{ secrets.BENCHMARK_HTTPS_PROXY }}
      no_proxy: localhost,127.0.0.1,::1,host.docker.internal
    steps:
      - name: Probe Langfuse through proxy and direct routes
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${LANGFUSE_BASE_URL:-}" || -z "${LANGFUSE_PUBLIC_KEY:-}" || -z "${LANGFUSE_SECRET_KEY:-}" ]]; then
            echo "Langfuse base URL or credentials are not configured" >&2
            exit 1
          fi

          endpoint="${LANGFUSE_BASE_URL%/}/api/public/projects"
          auth="$(printf '%s' "${LANGFUSE_PUBLIC_KEY}:${LANGFUSE_SECRET_KEY}" | base64 | tr -d '\n')"

          echo "Langfuse endpoint: ${LANGFUSE_BASE_URL%/}"
          echo "DNS records:"
          getent ahostsv4 "$(printf '%s' "$LANGFUSE_BASE_URL" | sed -E 's#^[a-zA-Z]+://([^/]+).*#\1#')" \
            | awk '{print $1}' | sort -u || true

          probe() {
            local label="$1"
            shift
            local response exit_code
            response="$(curl --silent --show-error --output /dev/null \
              --write-out 'http=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s' \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Basic ${auth}" "$@" "$endpoint" 2>&1)"
            exit_code=$?
            echo "${label}: curl_exit=${exit_code} ${response}"
          }

          # This uses the same lowercase proxy environment as benchmark publishing.
          probe "proxy-environment"

          # Force a direct route, independent of inherited proxy settings.
          probe "forced-direct" \
            --noproxy '*' \
            --proxy ''

          # Keep the proxy for every other destination, but bypass it for Langfuse.
          probe "langfuse-no-proxy" \
            --noproxy 'langfuse.aidenai.io,.aidenai.io'
