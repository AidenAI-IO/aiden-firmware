name: Build (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to execute the build on (runs-on value)'
        type: string
        required: true
      free_disk_space:
        description: 'Free up disk space before building (hosted runners only)'
        type: boolean
        default: false
    secrets:
      OTA_ED25519_PRIVATE_KEY:
        required: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ inputs.runner != 'self-hosted' || (startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target') }}
    runs-on: ${{ inputs.runner }}

    steps:
    - name: Reclaim workspace ownership (self-hosted)
      # The Docker build runs as root and a normal exit hands ownership back to
      # the runner user via build_image.sh's EXIT trap. Trap handlers cannot run
      # if the previous build was killed by SIGKILL or the host crashed, leaving
      # root-owned files that block actions/checkout's clean phase with EACCES.
      # This step is a defence-in-depth no-op when the trap already ran.
      if: ${{ inputs.runner == 'self-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ]; then
          exit 0
        fi
        # Use numeric uid:gid so this does not depend on the runner user's
        # account name being resolvable inside any nested context.
        owner="$(id -u):$(id -g)"
        if command -v sudo >/dev/null 2>&1; then
          sudo chown -R "$owner" "$GITHUB_WORKSPACE"
        elif [ "$(id -u)" -eq 0 ]; then
          chown -R "$owner" "$GITHUB_WORKSPACE"
        else
          echo "::warning::Skipping workspace ownership reclaim because sudo is unavailable and the current user is not root"
        fi

    - name: Remove unusable pico-sdk submodule checkout
      if: ${{ inputs.runner == 'self-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="$GITHUB_WORKSPACE/pico-sdk"
        sdk_git_dir="$GITHUB_WORKSPACE/.git/modules/pico-sdk"
        if [ ! -e "$sdk_dir" ] && [ ! -e "$sdk_git_dir" ]; then
          exit 0
        fi

        if [ -d "$sdk_dir" ] && git -C "$sdk_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
          exit 0
        fi

        rm -rf -- "$sdk_dir" "$sdk_git_dir"

    - name: Repair stale pico-sdk submodule metadata
      if: ${{ inputs.runner == 'self-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="$GITHUB_WORKSPACE/pico-sdk"
        if [ ! -d "$sdk_dir" ]; then
          exit 0
        fi

        if git -C "$sdk_dir" ls-files -s sysdrv/tools/board/ubuntu 2>/dev/null | grep -q '^160000 '; then
          git -C "$sdk_dir" config -f .gitmodules submodule.ubuntu.path sysdrv/tools/board/ubuntu
          git -C "$sdk_dir" config -f .gitmodules submodule.ubuntu.url https://github.com/luckfox-eng33/pico_ubuntu.git
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Fetch pico-sdk submodule
      run: |
        git submodule update --init --depth=1 pico-sdk
        git -C pico-sdk clean -f -- .gitmodules

    - name: Free hosted runner disk space
      if: ${{ inputs.free_disk_space }}
      run: |
        df -h
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean
        docker system prune -af || true
        df -h

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: src/agent/go.mod
        cache-dependency-path: src/agent/go.sum

    - name: Prepare OTA public key
      env:
        OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
      run: |
        if [ -z "${OTA_ED25519_PRIVATE_KEY}" ]; then
          echo "OTA_ED25519_PRIVATE_KEY secret is required for production image builds" >&2
          exit 1
        fi
        private_key="$RUNNER_TEMP/ota_ed25519_private_key.pem"
        public_key="$GITHUB_WORKSPACE/.ota-ci/ota_ed25519_public_key.pem"
        mkdir -p "$(dirname "$public_key")"
        printf '%s\n' "${OTA_ED25519_PRIVATE_KEY}" > "$private_key"
        chmod 600 "$private_key"
        openssl pkey -in "$private_key" -pubout -out "$public_key"
        scripts/validate_ota_pubkey.sh "$public_key"
        echo "OTA_PUBLIC_KEY_PATH=/home/.ota-ci/ota_ed25519_public_key.pem" >> "$GITHUB_ENV"

    - name: Generate release name
      id: release_info
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        COMMIT_HASH=$(git rev-parse --short HEAD)
        TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        RELEASE_NAME="${TIMESTAMP}-${COMMIT_HASH}"

        # Determine channel based on branch
        if [ "$GITHUB_REF_NAME" = "main" ]; then
          CHANNEL="stable"
        else
          # Sanitize branch name: replace / with - and remove any unsafe characters
          BRANCH_NAME=$(echo "$GITHUB_REF_NAME" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]/-/g')
          CHANNEL="dev-${BRANCH_NAME}"
        fi

        echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
        echo "tag_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
        echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
        echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

    - name: Run build script
      run: ./build_image.sh
    - name: Generate OTA manifest
      env:
        OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
      run: |
        if [ -z "${OTA_ED25519_PRIVATE_KEY}" ]; then
          echo "OTA_ED25519_PRIVATE_KEY secret is required for manifest signing" >&2
          exit 1
        fi
        private_key="$RUNNER_TEMP/ota_ed25519_private_key.pem"
        printf '%s\n' "${OTA_ED25519_PRIVATE_KEY}" > "$private_key"
        chmod 600 "$private_key"
        scripts/generate_ota_manifest.sh \
          --version "${{ steps.release_info.outputs.release_name }}" \
          --channel "${{ steps.release_info.outputs.channel }}" \
          --build-time "${{ steps.release_info.outputs.build_time }}" \
          --sign-key "$private_key" \
          --image-dir pico-sdk/output/image \
          --output pico-sdk/output/image/manifest.json

    - name: Generate OTA device config
      run: |
        bash scripts/generate_ota_device_config.sh \
          --manifest pico-sdk/output/image/manifest.json \
          --repo "$GITHUB_REPOSITORY" \
          --channel "${{ steps.release_info.outputs.channel }}" \
          --output pico-sdk/output/out/userdata/ota/config.json

    - name: Repack update image with OTA config
      run: ./build_image.sh bash ./scripts/repack_ota_update_image.sh

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_DEBUG: api
      run: |
        PRERELEASE_FLAG=""
        if [ "${{ steps.release_info.outputs.channel }}" != "stable" ]; then
          PRERELEASE_FLAG="--prerelease"
        fi

        bash scripts/create_github_release.sh \
          --release-name "${{ steps.release_info.outputs.release_name }}" \
          --tag-name "${{ steps.release_info.outputs.tag_name }}" \
          --target-commitish "${{ github.sha }}" \
          --asset-glob 'pico-sdk/output/image/*' \
          --required-assets 'boot_a.img boot_b.img oem.img rootfs.img update.img manifest.json' \
          --upload-assets 'boot_a.img boot_b.img oem.img rootfs.img update.img manifest.json' \
          --retry-count 5 \
          --retry-delay-seconds 30 \
          $PRERELEASE_FLAG
