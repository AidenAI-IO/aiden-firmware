name: Trigger documentation site build

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-build:
    name: Trigger website documentation build
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch documentation build
        env:
          GH_TOKEN: ${{ secrets.AIDEN_WEBSITE_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "AIDEN_WEBSITE_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi

          payload=$(jq -n \
            --arg event_type "aiden-firmware-docs-updated" \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            '{
              event_type: $event_type,
              client_payload: {
                repository: $repository,
                sha: $sha
              }
            }')

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --url https://api.github.com/repos/AidenAI-IO/aiden-website/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"
