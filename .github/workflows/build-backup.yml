name: Debian Build (backup / self-hosted-02)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight only: check the runner, secrets and toolchain, then stop before the firmware build'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the images as a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: backup-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    uses: ./.github/workflows/build.yml
    with:
      runner: aiden-hosted-02
      free_disk_space: false
      dry_run: ${{ inputs.dry_run }}
      publish_release: ${{ inputs.publish_release }}
    secrets: inherit
