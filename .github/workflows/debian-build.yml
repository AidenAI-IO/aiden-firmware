name: Debian Build (manual / self-hosted)

# Manual Debian armhf firmware build.
#
# The Buildroot workflows (build*.yml) are untouched. This one drives
# ./debian_build.sh end to end -- Stage 2 applications, Stage 3 rootfs/BSP,
# A/B factory images, a locally signed OTA manifest and the final audit -- and
# publishes output/debian/image as workflow artifacts. It deliberately does not
# create a tag or a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Self-hosted runner label to build on'
        type: choice
        default: aiden-hosted-01
        options:
          - aiden-hosted-01
          - aiden-hosted-02
      dry_run:
        description: 'Preflight only: check the runner, secrets and toolchain, then stop before the firmware build'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the images as a GitHub pre-release tagged with the build version'
        type: boolean
        default: true

permissions:
  # The build publishes its images as a pre-release.
  contents: write

concurrency:
  # The Debian build owns the whole runner workspace and the Docker daemon on
  # it. Queue dispatches instead of letting two builds share the tree.
  group: debian-build
  cancel-in-progress: false

jobs:
  build:
    # Every runner this job can land on is self-hosted, so the repo-branch guard
    # applies unconditionally: never execute pull request code on one.
    # scripts/test_github_actions_self_hosted_safety.sh enforces that a job with
    # a dynamic runs-on carries this expression. The empty-runner arm keeps the
    # guard correct if a trigger without an inputs context (push, schedule) is
    # ever added, since inputs.runner is null there.
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (inputs.runner == '' || startsWith(inputs.runner, 'aiden-hosted-')) }}
    runs-on: ${{ inputs.runner || 'aiden-hosted-01' }}
    timeout-minutes: 300

    steps:
    - name: Reclaim workspace ownership
      # Stage 3 assembles images in privileged containers, so output/ is left
      # owned by root. actions/checkout's clean phase then fails with EACCES,
      # and Go's module cache adds read-only directories it cannot remove
      # either. Both are cleared before checkout touches the tree.
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ]; then
          exit 0
        fi
        owner="$(id -u):$(id -g)"
        if command -v sudo >/dev/null 2>&1; then
          sudo chown -R "$owner" "$GITHUB_WORKSPACE"
        elif [ "$(id -u)" -eq 0 ]; then
          chown -R "$owner" "$GITHUB_WORKSPACE"
        else
          echo "::warning::Skipping workspace ownership reclaim because sudo is unavailable and the current user is not root"
        fi
        for go_mod_cache in \
          "$GITHUB_WORKSPACE/.cache" \
          "$GITHUB_WORKSPACE/build/.cache/go-mod"; do
          if [ -d "$go_mod_cache" ]; then
            chmod -R u+w "$go_mod_cache" || \
              echo "::warning::Skipping stale Go module cache unlock because chmod failed: $go_mod_cache"
          fi
        done

    - name: Remove unusable pico-sdk submodule checkout
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="$GITHUB_WORKSPACE/pico-sdk"
        sdk_git_dir="$GITHUB_WORKSPACE/.git/modules/pico-sdk"
        if [ ! -e "$sdk_dir" ] && [ ! -e "$sdk_git_dir" ]; then
          exit 0
        fi

        if [ -d "$sdk_dir" ] && git -C "$sdk_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
          exit 0
        fi

        rm -rf -- "$sdk_dir" "$sdk_git_dir"

    - name: Repair stale pico-sdk submodule metadata
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="$GITHUB_WORKSPACE/pico-sdk"
        if [ ! -d "$sdk_dir" ]; then
          exit 0
        fi

        if git -C "$sdk_dir" ls-files -s sysdrv/tools/board/ubuntu 2>/dev/null | grep -q '^160000 '; then
          git -C "$sdk_dir" config -f .gitmodules submodule.ubuntu.path sysdrv/tools/board/ubuntu
          git -C "$sdk_dir" config -f .gitmodules submodule.ubuntu.url https://github.com/luckfox-eng33/pico_ubuntu.git
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        # Nothing after checkout needs the job token: pico-sdk is a public
        # repository and the build makes no API calls.
        persist-credentials: false

    - name: Fetch pico-sdk submodule
      # Depth 1 is enough even though Stage 3 makes a local --shared clone of
      # this checkout: git declines to use alternates when the source is
      # shallow and copies the objects instead, so its repack/fsck path is
      # skipped and the detached checkout still resolves. debian_build.sh
      # asserts HEAD equals the pinned Stage 3 commit, which is exactly the
      # commit a depth-1 fetch lands on. Deepening instead means pulling ~1 GB
      # from github.com on every fresh runner.
      shell: bash
      run: |
        set -euo pipefail
        git submodule update --init --depth=1 pico-sdk

        # Both debian_build.sh and Stage 3 refuse to build unless this worktree
        # is pristine, and actions/checkout cannot deliver that: its
        # `git clean -ffdx` does not descend into an initialised submodule, so
        # whatever a previous job left here survives. Restore tracked files and
        # drop untracked ones, but leave ignored paths alone -- pico-sdk/output
        # is the Buildroot builds' incremental tree and they share this
        # checkout. This also removes the untracked .gitmodules that the
        # metadata repair step writes for older SDK commits.
        dirty="$(git -C pico-sdk status --porcelain)"
        if [ -n "$dirty" ]; then
          echo "::group::pico-sdk worktree was dirty; restoring it"
          printf '%s\n' "$dirty" | head -50
          echo "::endgroup::"
          git -C pico-sdk clean -ffd
          git -C pico-sdk checkout --force -- .
        fi

        remaining="$(git -C pico-sdk status --porcelain)"
        if [ -n "$remaining" ]; then
          echo "pico-sdk is still not clean after restore:" >&2
          printf '%s\n' "$remaining" | head -50 >&2
          exit 1
        fi
        git -C pico-sdk rev-parse HEAD

    - name: Verify Debian build script policies
      # Static contract checks over debian_build.sh and the Stage 2/3 scripts.
      # Seconds here, versus discovering the same drift an hour into the build.
      shell: bash
      run: |
        set -uo pipefail
        status=0
        for policy_test in test_debian_stage2 test_debian_stage3 test_debian_build; do
          script="scripts/${policy_test}.sh"
          if [ "$policy_test" = test_debian_build ] && ! command -v jq >/dev/null 2>&1; then
            echo "::warning::Skipping ${script} because jq is not installed on this runner"
            continue
          fi
          # These suites assert with bare `grep -q` and `[ ... ]`, which exit 1
          # without printing, so a bare failure here says only "exit 1". Trace
          # every attempt to a file and show it only when that attempt failed:
          # re-running afterwards is useless for the flaky assertion below,
          # which often passes the second time.
          attempt=1
          while :; do
            trace="${RUNNER_TEMP}/${policy_test}.attempt${attempt}.trace"
            if bash -x "$script" >"$trace" 2>&1; then
              echo "${script}: passed (attempt ${attempt})"
              break
            fi
            echo "::group::${script} attempt ${attempt} xtrace (last 60 lines)"
            tail -60 "$trace"
            echo "::endgroup::"
            if [ "$attempt" -ge 2 ]; then
              echo "::error::${script} failed twice; the trace above ends at the failing assertion"
              status=1
              break
            fi
            # test_debian_stage2.sh ends in a live mock stress run whose
            # assertions read host timing, CMA recovery and log patterns, so it
            # fails under load on a shared runner. One repeat separates that
            # from a real regression, which fails both times.
            echo "::warning::${script} failed; retrying once"
            attempt=2
          done
        done
        exit "$status"

    - name: Verify build host prerequisites
      # debian_build.sh's own list, plus what the Stage 3 host-side BSP audit
      # needs. audit-bsp.sh runs outside the build containers and is only
      # reached after the kernel is built, so a tool missing there costs a
      # two-hour build. Checking the union here also gives the dry run
      # something to report, since it never reaches either script's own check.
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for command in awk cmp curl date docker fdtget find getconf git grep id \
          install od openssl python3 readlink sha256sum sort stat tar tr xargs; do
          command -v "$command" >/dev/null 2>&1 || missing+=("$command")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing required build host commands: ${missing[*]}" >&2
          for command in "${missing[@]}"; do
            case "$command" in
              fdtget)
                echo "  ${command}: provided by the device-tree-compiler package" >&2
                ;;
            esac
          done
          exit 1
        fi
        docker info >/dev/null 2>&1 || {
          echo "Docker is unavailable; the runner user must be able to reach the daemon" >&2
          exit 1
        }
        echo "All required build host commands are present"

    - name: Report available disk space
      shell: bash
      run: df -h "$GITHUB_WORKSPACE" /var/lib/docker 2>/dev/null || df -h

    - name: Configure Go proxy
      run: echo "GOPROXY=https://goproxy.cn" >> "$GITHUB_ENV"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: src/agent/go.mod
        cache-dependency-path: src/agent/go.sum

    - name: Prepare agent configuration
      # Stage 3 installs an external agent.toml into userdata.img and never
      # copies one out of the source tree. Validate it here so a bad secret
      # fails in seconds instead of an hour into the image assembly step.
      env:
        AGENT_CONFIG_TOML: ${{ secrets.AGENT_CONFIG_TOML }}
      shell: bash
      run: |
        set -euo pipefail
        agent_config="$RUNNER_TEMP/agent.toml"
        if [ -n "${AGENT_CONFIG_TOML:-}" ]; then
          printf '%s\n' "$AGENT_CONFIG_TOML" > "$agent_config"
          echo "Using the AGENT_CONFIG_TOML repository secret"
        else
          cp src/agent/config/agent.toml "$agent_config"
          echo "::warning::AGENT_CONFIG_TOML secret is unset; building with the src/agent/config/agent.toml template, which carries no provider credentials"
        fi
        chmod 600 "$agent_config"
        (cd src/agent && go run ./cmd/daemon config-check --format=json --config="$agent_config")
        echo "AGENT_CONFIG_PATH=$agent_config" >> "$GITHUB_ENV"

    - name: Prepare OTA signing keys
      env:
        OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${OTA_ED25519_PRIVATE_KEY:-}" ]; then
          echo "OTA_ED25519_PRIVATE_KEY secret is required to sign the Debian OTA manifest" >&2
          exit 1
        fi
        private_key="$RUNNER_TEMP/ota_ed25519_private_key.pem"
        public_key="$RUNNER_TEMP/ota_ed25519_public_key.pem"
        printf '%s\n' "$OTA_ED25519_PRIVATE_KEY" > "$private_key"
        chmod 600 "$private_key"
        openssl pkey -in "$private_key" -pubout -out "$public_key"
        scripts/validate_ota_pubkey.sh "$public_key"
        echo "OTA_PRIVATE_KEY_PATH=$private_key" >> "$GITHUB_ENV"
        echo "OTA_PUBLIC_KEY_PATH=$public_key" >> "$GITHUB_ENV"
        # Pin the trust anchor to the key this build signs with. Left unset,
        # debian_build.sh would bake in the committed keys/ota_pubkey.pem, and
        # a rotated secret would then ship images trusting the previous signer
        # while the manifests came from the new one.
        echo "OTA_TRUST_PUBLIC_KEY_PATH=$public_key" >> "$GITHUB_ENV"

    - name: Ensure armhf binfmt registration
      # Stage 3 runs the freshly built armhf agent on the host to validate
      # agent.toml, so the kernel needs an arm interpreter. The rootfs builder
      # registers one for its own chroot, but only after that point.
      shell: bash
      run: |
        set -euo pipefail
        binfmt_dir=/proc/sys/fs/binfmt_misc
        if [ -r "$binfmt_dir/qemu-arm" ] && grep -qx enabled "$binfmt_dir/qemu-arm"; then
          echo "qemu-arm binfmt handler is already registered"
          exit 0
        fi
        docker run --privileged --rm \
          tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 \
          --install arm
        if [ ! -r "$binfmt_dir/qemu-arm" ] || ! grep -qx enabled "$binfmt_dir/qemu-arm"; then
          echo "qemu-arm binfmt registration failed; the host cannot execute armhf binaries" >&2
          exit 1
        fi

    - name: Resolve build metadata
      id: meta
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        commit=$(git rev-parse --short=12 HEAD)
        timestamp=$(date -u +'%Y%m%d-%H%M%S')
        build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        branch=$(printf '%s' "$GITHUB_REF_NAME" | sed 's#/#-#g; s#[^a-zA-Z0-9._-]#-#g')

        if [ "$GITHUB_REF_NAME" = "main" ]; then
          channel="debian-stable"
        else
          channel="debian-dev-${branch}"
        fi

        # Build with everything the runner has. debian_build.sh caps its own
        # default at the online CPU count, which would hold a larger machine
        # down to that default rather than use it.
        rk_jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)
        case "$rk_jobs" in
          '' | *[!0-9]* | 0)
            echo "could not determine the online CPU count: '$rk_jobs'" >&2
            exit 1
            ;;
        esac

        {
          echo "version=debian-${timestamp}-${commit}"
          echo "channel=${channel}"
          echo "build_time=${build_time}"
          echo "artifact_name=debian-firmware-${branch}-${timestamp}-${commit}"
          echo "rk_jobs=${rk_jobs}"
        } >> "$GITHUB_OUTPUT"
        echo "Building with RK_JOBS=${rk_jobs}"

    - name: Run Debian firmware build
      if: ${{ !inputs.dry_run }}
      env:
        RK_JOBS: ${{ steps.meta.outputs.rk_jobs }}
        OTA_REPO: ${{ github.repository }}
        OTA_CHANNEL: ${{ steps.meta.outputs.channel }}
        OTA_BUILD_VERSION: ${{ steps.meta.outputs.version }}
        OTA_BUILD_TIME: ${{ steps.meta.outputs.build_time }}
      run: ./debian_build.sh

    - name: Summarize firmware output
      if: ${{ !inputs.dry_run }}
      shell: bash
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        CHANNEL: ${{ steps.meta.outputs.channel }}
      run: |
        set -euo pipefail
        image_dir=output/debian/image
        {
          echo "## Debian firmware"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Version | \`${VERSION}\` |"
          echo "| Channel | \`${CHANNEL}\` |"
          echo "| Commit | \`${GITHUB_SHA}\` |"
          echo "| update.img SHA-256 | \`$(awk '{print $1}' "${image_dir}/update.img.sha256")\` |"
          echo
          echo "| Artifact | Size |"
          echo "| --- | ---: |"
          for artifact in "${image_dir}"/*.tar.gz "${image_dir}"/manifest.json; do
            [ -f "$artifact" ] || continue
            echo "| $(basename "$artifact") | $(du -h "$artifact" | cut -f1) |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Debian firmware artifacts
      if: ${{ !inputs.dry_run }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.artifact_name }}
        # update.img itself ships as update.img.tar.gz: uploading the raw copy
        # too would double an already large transfer for no extra content.
        path: |
          output/debian/image/*.tar.gz
          output/debian/image/manifest.json
          output/debian/image/update.img.sha256
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

    - name: Publish GitHub pre-release
      # Always a pre-release: create_github_release.sh then skips --latest, so
      # these images never displace the Buildroot releases that hold that tag.
      # The debian- prefix on the tag and the manifest channel keep the two
      # apart for anyone browsing the releases page, and for the OTA config
      # baked into the image, which resolves updates by repository and channel.
      if: ${{ !inputs.dry_run && inputs.publish_release }}
      # create_github_release.sh retries, but nothing bounds a single attempt,
      # so a connection that hangs rather than fails blocks until the job
      # timeout. One such publish burned three hours of runner time after the
      # firmware had already been built and uploaded. A healthy publish of this
      # asset set takes about five minutes.
      timeout-minutes: 30
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.meta.outputs.version }}
        RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
      shell: bash
      run: |
        set -euo pipefail
        release_assets='boot_a.img.tar.gz boot_b.img.tar.gz oem.img.tar.gz rootfs.img.tar.gz update.img.tar.gz manifest.json'
        bash scripts/create_github_release.sh \
          --release-name "$RELEASE_TAG" \
          --tag-name "$RELEASE_TAG" \
          --target-commitish "$GITHUB_SHA" \
          --asset-glob 'output/debian/image/*' \
          --required-assets "$release_assets" \
          --upload-assets "$release_assets update.img.sha256" \
          --retry-count 10 \
          --retry-delay-seconds 30 \
          --prerelease

        # create_github_release.sh writes generic notes shared with the
        # Buildroot builds. Replace them so the page says which userspace this
        # is and how to get a flashable image out of the archive.
        notes="$RUNNER_TEMP/release-notes.md"
        {
          printf 'Debian userspace firmware, built by `.github/workflows/debian-build.yml`.\n\n'
          printf '| Field | Value |\n| --- | --- |\n'
          printf '| Channel | `%s` |\n' "$RELEASE_CHANNEL"
          printf '| Commit | `%s` |\n' "$GITHUB_SHA"
          printf '| update.img SHA-256 | `%s` |\n\n' \
            "$(awk '{print $1}' output/debian/image/update.img.sha256)"
          printf 'Flash:\n\n'
          printf '```\ntar -xzf update.img.tar.gz\n'
          printf 'sha256sum -c update.img.sha256\n'
          printf './upgrade_tool/upgrade_tool uf ./update.img\n```\n\n'
          printf 'Marked as a pre-release. The Buildroot builds publish separately '
          printf 'and keep the Latest tag; their tags carry no `debian-` prefix.\n'
        } >"$notes"
        gh release edit "$RELEASE_TAG" --notes-file "$notes"

    - name: Upload Debian build reports
      if: ${{ always() && !inputs.dry_run }}
      uses: actions/upload-artifact@v4
      with:
        name: debian-build-reports-${{ steps.meta.outputs.artifact_name || github.run_id }}
        path: |
          output/debian-stage2/apps-audit/summary.txt
          output/debian-stage3/audit-report.txt
        if-no-files-found: ignore
        retention-days: 7

    - name: Remove build secrets from the runner
      if: always()
      shell: bash
      run: |
        rm -f \
          "$RUNNER_TEMP/agent.toml" \
          "$RUNNER_TEMP/ota_ed25519_private_key.pem" \
          "$RUNNER_TEMP/ota_ed25519_public_key.pem"

    - name: Leave the workspace cleanable
      # Stage 2 fills .cache/debian-stage2/go-mod with read-only module
      # directories. They outlive this job and would block the clean phase of
      # the next checkout here -- including a Buildroot build sharing this
      # workspace -- so unlock them before handing the runner back.
      if: always()
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/.cache" ]; then
          chmod -R u+w "$GITHUB_WORKSPACE/.cache" || \
            echo "::warning::Could not unlock $GITHUB_WORKSPACE/.cache for the next checkout"
        fi
