name: Build (nightly / self-hosted)

on:
  schedule:
    - cron: '0 0 * * *'  # Run at 00:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      runner: self-hosted
      free_disk_space: false
    secrets: inherit
