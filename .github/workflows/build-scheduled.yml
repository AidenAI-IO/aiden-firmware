name: Debian Build (manual / primary)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the build environment only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: primary-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    uses: ./.github/workflows/build.yml
    with:
      runner: aiden-hosted-01
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
