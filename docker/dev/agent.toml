[basic_settings.language_timezone]
locale = "en-US"
timezone = "UTC"

[basic_settings.device]
device_type = "iOS"

[model_settings.model]
provider = "fake"
responses = ["Aiden Docker sandbox is running. Configure an LLM provider in Config Web to handle real tasks."]

[conversation_settings.search]
provider = "duckduckgo"

# input_mode is intentionally unset: this sandbox configures no STT/TTS
# provider, and stt/realtime both require their own. An unset mode is valid
# and means the agent is reachable through the Web UI and HTTP API only.

[advanced_settings.runtime.telemetry]
enabled = false
