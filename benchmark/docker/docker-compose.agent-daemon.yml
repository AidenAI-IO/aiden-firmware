services:
  daemon:
    image: ${AIDEN_DAEMON_IMAGE:-aiden-agent-daemon:local}
    build:
      context: ../..
      dockerfile: benchmark/docker/Dockerfile.agent-daemon
      target: agent-daemon-runtime
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "127.0.0.1:${AIDEN_DAEMON_HOST_PORT:-8080}:8080"
    volumes:
      - ${AIDEN_CONFIG_DIR:-../config}:/config:ro
    environment:
      AIDEN_ENVIRONMENT_BRIDGE_MODE: ${AIDEN_ENVIRONMENT_BRIDGE_MODE:-0}
      AIDEN_ENVIRONMENT_BRIDGE_TOOLS: "screenshot,touch_gesture,keyboard_text,keyboard_tap,enter_text_in_field,enter_text_via_bridge,search_launch_app,mouse_click,mouse_move,mouse_scroll,quick_action,bridge_open_app,bridge_clipboard,bridge_calendar,bridge_contacts,bridge_notification"
      ENVIRONMENT_BRIDGE_ENDPOINT: ${ENVIRONMENT_BRIDGE_ENDPOINT:-}
      AIDEN_BENCHMARK_TASK_ID: ${AIDEN_BENCHMARK_TASK_ID:-}
      AIDEN_BENCHMARK_TOKEN_FILE: ${AIDEN_BENCHMARK_TOKEN_FILE:-}
      AIDEN_RUNTIME_CONFIG_DIR: /tmp/aiden-config
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
