# 使用 CI 预构建的镜像（无需本地构建）
#
# 用法:
#   docker compose -f docker-compose.prebuilt.yml pull   # 拉取镜像
#   docker compose -f docker-compose.prebuilt.yml up -d  # 启动
#
# 切回本地构建：使用 docker-compose.yml

services:
  mobilegym:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-aidenai-io}/aiden-hardware-demo/mobilegym-simulator:${TAG:-latest}
    container_name: aiden-mobilegym
    ports:
      - "${MOBILEGYM_PORT:-4173}:4173"
    networks:
      - aiden-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 5

  daemon:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-aidenai-io}/aiden-hardware-demo/mobilegym-daemon:${TAG:-latest}
    container_name: aiden-daemon
    ports:
      - "${AIDEN_DAEMON_PORT:-8080}:8080"
    volumes:
      - ../config:/config:ro
      - daemon-logs:/app/log
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
    networks:
      - aiden-net
    depends_on:
      mobilegym:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-aidenai-io}/aiden-hardware-demo/mobilegym-test:${TAG:-latest}
    volumes:
      - ../../runs:/app/benchmark/runs
      - ../config:/config:ro
      - ../suites:/app/suites:ro
    environment:
      - MOBILEGYM_ROOT=/mobilegym
      - AIDEN_DAEMON_URL=http://daemon:8080
      - AIDEN_CONTROL_TOKEN_FILE=/config/control_token
    networks:
      - aiden-net
    depends_on:
      daemon:
        condition: service_healthy
    profiles:
      - test
    command: >
      --mobilegym-root /mobilegym
      --suite all
      --env-url http://mobilegym:4173
      --aiden-daemon-url http://daemon:8080
      --parallel 1
      --headless

networks:
  aiden-net:
    driver: bridge

volumes:
  daemon-logs:
