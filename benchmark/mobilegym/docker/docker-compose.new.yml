# MobileGym Simulator-Only Docker Compose
#
# This compose file runs MobileGym as a pure simulator (not a test framework).
# Test execution uses benchmark/runner/main.py with standard suites/*.json.

version: '3.8'

services:
  # MobileGym web simulator (upstream)
  mobilegym-web:
    image: ghcr.io/google-research/mobilegym:latest
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MobileGym simulator + Bridge server
  mobilegym-simulator:
    build:
      context: ../..
      dockerfile: benchmark/mobilegym/docker/Dockerfile.simulator
    environment:
      - MOBILEGYM_ENV_URL=http://mobilegym-web:4173
      - AIDEN_BRIDGE_BIND_HOST=0.0.0.0
      - AIDEN_BRIDGE_PORT=8888
      - AIDEN_BRIDGE_PUBLIC_HOST=mobilegym-simulator
    ports:
      - "8888:8888"
    volumes:
      - mobilegym-tokens:/tokens
    command: >
      python benchmark/mobilegym/scripts/start_simulator.py
      --env-url http://mobilegym-web:4173
      --bridge-host 0.0.0.0
      --bridge-port 8888
      --bridge-public-host mobilegym-simulator
      --token-dir /tokens
      --bridge-url-file /tokens/bridge_url
    depends_on:
      mobilegym-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aiden Go daemon
  aiden-daemon:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    environment:
      - AIDEN_RUNTIME_CONFIG_DIR=/config
      - AIDEN_CONTROL_TOKEN_FILE=/config/control_token
    ports:
      - "8080:8080"
    volumes:
      - ../config:/config:ro
      - aiden-data:/userdata
      - mobilegym-tokens:/tokens:ro
    command: >
      sh -c "
      /app/aiden-go --config /config/agent.toml --port 8080 &
      DAEMON_PID=\$!
      sleep 5
      python /app/benchmark/mobilegym/scripts/configure_daemon.py
        --daemon-url http://localhost:8080
        --bridge-url \$(cat /tokens/bridge_url)
        --bridge-token-file /tokens/bridge_device_token
        --control-token-file /config/control_token
      wait \$DAEMON_PID
      "
    depends_on:
      mobilegym-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Benchmark runner (uses benchmark/runner/main.py)
  runner:
    build:
      context: ../..
      dockerfile: benchmark/mobilegym/docker/Dockerfile.runner
    environment:
      - AIDEN_AGENT_URL=http://aiden-daemon:8080
      - AIDEN_MODEL=${MODEL_NAME:-claude-sonnet-4-6}
      - JUDGE_MODEL=${JUDGE_MODEL:-claude-sonnet-4-6}
    volumes:
      - ../../runs:/benchmark/runs
      - ../../suites:/benchmark/suites:ro
    command: >
      python -m benchmark.runner run
      --suite /benchmark/suites/mobilegym_basic.json
      --agent-url http://aiden-daemon:8080
    depends_on:
      aiden-daemon:
        condition: service_healthy
    profiles:
      - test

volumes:
  mobilegym-tokens:
  aiden-data:

networks:
  default:
    name: mobilegym-simulator-network
