# 国内镜像加速版本
# 使用方法: docker compose -f docker-compose.cn.yml build

services:
  mobilegym:
    build:
      context: ../../..
      dockerfile: benchmark/mobilegym/docker/Dockerfile.cn
      target: mobilegym-base
    container_name: aiden-mobilegym
    ports:
      - "4173:4173"
    networks:
      - aiden-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 5

  daemon:
    build:
      context: ../../..
      dockerfile: benchmark/mobilegym/docker/Dockerfile.cn
      target: daemon-runtime
    container_name: aiden-daemon
    ports:
      - "8080:8080"
    volumes:
      - ../config:/config:ro
      - daemon-logs:/app/log
    networks:
      - aiden-net
    depends_on:
      mobilegym:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ../../..
      dockerfile: benchmark/mobilegym/docker/Dockerfile.cn
      target: test-runner
    container_name: aiden-test
    volumes:
      - ../../runs:/app/benchmark/runs
      - ../config:/config:ro
    environment:
      - MOBILEGYM_ROOT=/mobilegym
      - AIDEN_DAEMON_URL=http://daemon:8080
      - AIDEN_CONTROL_TOKEN_FILE=/config/control_token
    networks:
      - aiden-net
    depends_on:
      daemon:
        condition: service_healthy
    profiles:
      - test

networks:
  aiden-net:
    driver: bridge

volumes:
  daemon-logs:
