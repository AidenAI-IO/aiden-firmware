[project]
name = "aiden-benchmark"
version = "0.1.0"
description = "Agent-driven phone-control benchmark for the Aiden hardware demo"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
