reviews:
  tools:
    golangci-lint:
      # CodeRabbit runs golangci-lint from the repository root with ./..., but
      # this repository's Go module lives under src/agent. Keep the module-local
      # config for local/CI use and disable the CodeRabbit tool until it can run
      # with src/agent as the working directory.
      enabled: false
      config_file: src/agent/.golangci.yml
