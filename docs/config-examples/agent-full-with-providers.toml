# Aiden Agent Configuration with Multiple Providers
# A complete example showing how to configure several model providers and switch
# between them.

# ========================================
# Providers
# ========================================
# Declare every available model provider. To switch, edit the `provider` field
# in [model] below.

# OpenAI official API
[providers.openai-main]
provider = "openai"
api_key = "sk-your-openai-key"

# Moonshot AI (Kimi) - international
[providers.kimi-global]
provider = "kimi"
api_key = "sk-your-kimi-key"

# Moonshot AI (Kimi) - China
[providers.kimi-cn]
provider = "kimi-cn"
api_key = "sk-your-kimi-cn-key"

# Volcengine (Doubao)
# Note: base_url is honored only for `openai` and `ollama`. Setting it here
# would be dropped at load, so the built-in Volcengine endpoint is used.
[providers.doubao]
provider = "volcengine"
api_key = "your-volcengine-key"

# OpenRouter (aggregates many models)
[providers.openrouter]
provider = "openrouter"
api_key = "sk-or-your-key"

# Ollama local models
[providers.local]
provider = "ollama"
base_url = "http://localhost:11434"

# ========================================
# Model
# ========================================
[model]
# Which provider to use, by section name. Switching providers means editing
# this one line.
provider = "openai-main"

# Model name
model = "gpt-4o"

# Optional settings
temperature = 0.7
max_response_tokens = 4096
# log_raw_http = true  # enable request/response debug logging

# ========================================
# Model Text (optional)
# ========================================
# A separate provider for text mode.
[model_text]
provider = "kimi-global"
model = "moonshot-v1-8k"

# ========================================
# TTS
# ========================================
[tts]
provider = "minimax-cn"
api_key = "your-minimax-key"
voice_id = "male-qn-qingse"
emotion = "happy"

# ========================================
# STT
# ========================================
[stt]
provider = "openai-whisper"
api_key = "sk-your-openai-key"
model = "whisper-1"
language = "zh"

# ========================================
# Base settings
# ========================================
[hid]
pointer_mode = "absolute"

[audio]
sample_rate = 16000
channels = 1
bit_width = 16

# ========================================
# Switching examples
# ========================================
#
# Switch to Kimi:
#   provider = "kimi-global"
#   model = "moonshot-v1-32k"
#
# Switch to local Ollama:
#   provider = "local"
#   model = "qwen2.5:14b"
#
# Switch to Doubao:
#   provider = "doubao"
#   model = "doubao-pro-32k"
#
# Switch to OpenRouter:
#   provider = "openrouter"
#   model = "anthropic/claude-3.5-sonnet"
