# Example: Multiple Provider Configuration
# This example shows how to configure multiple model providers and switch between them easily.

# ===== Step 1: Define available providers =====
# Each provider is given a custom name and includes connection details

[providers.openai-work]
provider = "openai"
api_key = "sk-work-xxx"

[providers.openai-personal]
provider = "openai"
api_key = "sk-personal-xxx"

[providers.kimi-main]
provider = "kimi"
api_key = "sk-kimi-xxx"

[providers.kimi-cn]
provider = "kimi-cn"
api_key = "sk-kimi-cn-xxx"

# Volcengine uses its built-in endpoint; base_url is only honored for
# provider = "openai" and provider = "ollama".
[providers.volcengine]
provider = "volcengine"
api_key = "volcengine-xxx"

[providers.ollama-local]
provider = "ollama"
base_url = "http://localhost:11434"

[providers.openrouter]
provider = "openrouter"
api_key = "sk-or-xxx"

# ===== Step 2: Select which provider to use =====
# Just change the provider name to switch between configured providers

[model]
provider = "openai-work"     # References providers.openai-work
model = "gpt-4o"
temperature = 0.7
max_response_tokens = 4096

# Optional: Configure a different provider for text mode
[model_text]
provider = "kimi-main"       # References providers.kimi-main
model = "moonshot-v1-8k"

# ===== Usage Examples =====

# Example 1: Switch to personal OpenAI account
# Just change: provider = "openai-personal"

# Example 2: Switch to local Ollama
# Just change: provider = "ollama-local"
# And set: model = "qwen2.5:14b"

# Example 3: Switch to Kimi (China)
# Just change: provider = "kimi-cn"
# And set: model = "moonshot-v1-32k"

# Example 4: Override provider settings in model config
# You can still override provider settings:
# [model]
# provider = "openai-work"
# model = "gpt-4o"
# api_key = "sk-different-key"  # This overrides the provider's api_key

# Example 5: Backward compatibility (direct provider type)
# The old way still works if you don't define providers:
# [model]
# provider = "openai"
# model = "gpt-4o"
# api_key = "sk-xxx"
