FRAME_SERVICE_BIN=/oem/usr/bin/frame_service
SOCKET_PATH=/run/frame_service/frame_service.sock
FRAME_SERVICE_FPS=30
FRAME_SERVICE_WIDTH=1920
FRAME_SERVICE_HEIGHT=1080
# Leave empty to use the mode-aware default: discard six queued frames while
# STREAMON is kept active, and discard none when streaming restarts per request.
FRAME_SERVICE_WARMUP_FRAMES=
# Black screens and single-colour pages are valid screenshots.
FRAME_SERVICE_ALLOW_UNIFORM_FRAMES=1
FRAME_SERVICE_PIXEL_FORMAT=nv12
# Software JPEG is the safe Debian default. The Rockit VENC path remains
# available as an explicit opt-in for images whose mpp_vcodec driver is known
# to support JPEG input (set FRAME_SERVICE_JPEG_ENCODER=hardware).
FRAME_SERVICE_JPEG_ENCODER=software
# Optional preferred Rockit VENC channel (0..63). Unset uses automatic selection.
# FRAME_SERVICE_VENC_CHANNEL=63
FRAME_SERVICE_FORCE_TRIGGER=auto
FRAME_SERVICE_SUBDEV=
FRAME_SERVICE_EDID=auto
FRAME_SERVICE_TC358743_EDID=/oem/usr/share/aiden/edid/hdmi_1080p30_cta.hex
FRAME_SERVICE_TC358743_HPD_LOW_SECONDS=2
FRAME_SERVICE_TC358743_SETTLE_SECONDS=5
LOG_PATH=/var/log/frame_service/frame_service.log
