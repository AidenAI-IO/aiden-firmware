# Aiden Debian production feature switches. These values are image-owned and
# are consumed through systemd EnvironmentFile= plus a strict ExecCondition.
ENABLE_USB_HID=1
ENABLE_FRAME_SERVICE=1
ENABLE_AUDIO_SERVICE=1
ENABLE_AGENT=1
ENABLE_USB_DHCP=1
ENABLE_CONFIG_WEB=1
ENABLE_WETTY=0
ENABLE_WIFIDRV=1
ENABLE_WLAN_GUARD=1
ENABLE_BLUETOOTH_HCI=1
ENABLE_BLE_SERVICE=1
ENABLE_ZRAM=1
ENABLE_SWAP=1

ZRAM_SIZE_MB=64
ZRAM_SWAPPINESS=100
ZRAM_COMP_ALGORITHM=lzo
