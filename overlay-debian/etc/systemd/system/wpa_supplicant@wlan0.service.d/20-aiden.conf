[Unit]
Requires=aiden-wifi-driver.service aiden-userdata-migrate.service
After=aiden-wifi-driver.service aiden-userdata-migrate.service

[Service]
Environment=AIDEN_WPA_SUPPLICANT_CONFIG=/userdata/debian/wifi/wpa_supplicant-wlan0.conf
EnvironmentFile=-/run/aiden/wpa_supplicant-config.env
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c ${AIDEN_WPA_SUPPLICANT_CONFIG} -i %I
Restart=on-failure
RestartSec=2s
