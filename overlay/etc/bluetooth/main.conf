[General]
Name=Aiden
ControllerMode=le
DiscoverableTimeout=0
PairableTimeout=300
JustWorksRepairing=confirm

[Policy]
AutoEnable=true

[LE]
# Keep the peripheral connection responsive enough for iOS to detect loss of
# the USB-powered board promptly. Connection intervals use 1.25 ms units and
# the supervision timeout uses 10 ms units.
MinConnectionInterval=12
MaxConnectionInterval=24
ConnectionLatency=0
ConnectionSupervisionTimeout=200
