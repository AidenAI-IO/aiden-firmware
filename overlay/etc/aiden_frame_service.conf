# Aiden frame_service init configuration.
# This file is sourced by /etc/init.d/S52frame_service.

FRAME_SERVICE_BIN=/oem/usr/bin/frame_service

SOCKET_PATH=/run/frame_service/frame_service.sock
FRAME_SERVICE_FPS=30
FRAME_SERVICE_WIDTH=1920
FRAME_SERVICE_HEIGHT=1080
# Bridge-aware default: preserve the RK628 driver's 1080p60 timing, while the
# legacy TC358743 path keeps its historical one-shot EDID/HPD retrigger.
# Explicit 0 or 1 overrides automatic bridge detection.
FRAME_SERVICE_FORCE_TRIGGER=auto
# Optional HDMI bridge subdevice. Leave empty to auto-detect RK628/TC358743
# from /sys/class/video4linux; the binary fallback remains /dev/v4l-subdev2.
FRAME_SERVICE_SUBDEV=
# Optional external EDID hex file. Leave empty to use frame_service built-in
# 1080p60-only EDID.
FRAME_SERVICE_EDID=
LOG_PATH=/var/log/frame_service/frame_service.log
PID_FILE=/run/frame_service/frame_service.pid
WATCHDOG_PID_FILE=/run/frame_service/frame_service_watchdog.pid
