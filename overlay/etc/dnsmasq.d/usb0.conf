# DHCP only on usb0. Never touch wlan0 (it's a DHCP client there).
interface=usb0
bind-interfaces
except-interface=wlan0
except-interface=lo

# Disable DNS completely; usb0 only serves the local portal subnet.
port=0
no-resolv
no-hosts

# Hand out 192.168.42.100-200, 12h lease.
#
# Do not advertise a real default gateway on usb0. Apple devices will
# happily promote this wired link to the primary route if option 3 points
# at 192.168.42.1, which breaks the phone/Mac's normal internet access
# because this board only serves the local 192.168.42.0/24 subnet.
#
# The interface netmask already gives the host a connected route to
# 192.168.42.0/24, so it can still reach http://192.168.42.1 directly.
#
# DNS option is intentionally empty so the host keeps using its own WiFi/
# cellular DNS instead of sending arbitrary lookups to this local-only box.
dhcp-range=192.168.42.100,192.168.42.200,255.255.255.0,12h
dhcp-authoritative
dhcp-option=option:router
dhcp-option=option:dns-server

# Lease file for ECM watchdog ARP probe target discovery.
dhcp-leasefile=/tmp/dnsmasq.leases

log-dhcp
