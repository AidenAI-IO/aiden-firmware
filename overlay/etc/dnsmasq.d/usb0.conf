# DHCP + DNS only on usb0. Never touch wlan0 (it's a DHCP client there).
interface=usb0
bind-interfaces
except-interface=wlan0
except-interface=lo

# No upstream DNS forwarding; we just hand out the gateway.
no-resolv
no-hosts

# Hand out 192.168.42.100-200, 12h lease. No default route so Mac keeps
# using its own WiFi/Ethernet for internet.
dhcp-range=192.168.42.100,192.168.42.200,255.255.255.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server

log-dhcp
