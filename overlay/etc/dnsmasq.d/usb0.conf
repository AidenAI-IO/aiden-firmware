# DHCP + DNS only on usb0. Never touch wlan0 (it's a DHCP client there).
interface=usb0
bind-interfaces
except-interface=wlan0
except-interface=lo

# No upstream DNS forwarding; we just hand out the gateway.
no-resolv
no-hosts

# Hand out 192.168.42.100-200, 12h lease. Gateway + DNS = 192.168.42.1.
dhcp-range=192.168.42.100,192.168.42.200,255.255.255.0,12h
dhcp-option=option:router,192.168.42.1
dhcp-option=option:dns-server,192.168.42.1

# Resolve any hostname to the device so captive-portal probes land on us.
address=/#/192.168.42.1

log-dhcp
