# Aiden boot feature switches.
# 1 = enabled, 0 = disabled
#
# Keep defaults enabled to preserve current behavior. Product/debug
# variants can override these values to slim startup services.

# Core runtime services
ENABLE_USB_HID=1
ENABLE_FRAME_SERVICE=1
ENABLE_AUDIO_SERVICE=1

# Compressed in-memory swap. The logical size is allocated on demand, not
# reserved in full at boot. 64 MiB is a conservative starting point for the
# Pico Zero; observe /sys/block/zram0/mm_stat before increasing it.
ENABLE_ZRAM=1
ZRAM_SIZE_MB=64
ZRAM_SWAPPINESS=100
ZRAM_COMP_ALGORITHM=lzo

# Optional management/configuration services
ENABLE_AGENT=1
ENABLE_USB_DHCP=1
ENABLE_CONFIG_WEB=1
ENABLE_WETTY=1

# USB compatibility shim scripts (override SDK defaults)
ENABLE_USBDEVICE_SHIM=1
ENABLE_USB0CONFIG_SHIM=1

# System baseline network stack switches
ENABLE_DBUS=1
ENABLE_NETWORK=1

# Start dhcpcd with -b so it detaches immediately instead of holding up rcS
# until a lease arrives (or its 30s timeout expires). Set to 0 to restore the
# SDK's blocking behaviour. See /etc/init.d/S41dhcpcd.
DHCPCD_BACKGROUND=1
ENABLE_WIFIDRV=1
ENABLE_WLAN_GUARD=1
ENABLE_BLUETOOTH_HCI=1
ENABLE_BLUETOOTHD=1
ENABLE_BLE_SERVICE=1
ENABLE_NTP=1

# NTP fallback server, used only when /etc/ntp.conf is absent. Must be a
# numeric IPv4 address so ntpd does not depend on DNS being up at boot.
# The overlay normally ships /etc/ntp.conf so this is a defence-in-depth
# default.
NTP_FALLBACK_SERVER=203.107.6.88

# NTP watchdog: periodically check if ntpd has synced the clock and fire a
# one-shot step if not. Runs once at boot until sync is achieved or timeout.
NTP_WATCHDOG_INTERVAL=5
NTP_WATCHDOG_TIMEOUT=600

# Minimum year considered a "synced" clock. The watchdog treats the system
# clock as valid once `date +%Y` reaches this value. Must be a numeric year;
# a non-numeric value falls back to the built-in default (2026).
NTP_BASELINE_YEAR=2026

# System baseline service switches
ENABLE_TELNET=0
ENABLE_SMB=0
ENABLE_SSHD=1
