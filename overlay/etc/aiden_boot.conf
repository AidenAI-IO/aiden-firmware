# Aiden boot feature switches.
# 1 = enabled, 0 = disabled
#
# Keep defaults enabled to preserve current behavior. Product/debug
# variants can override these values to slim startup services.

# Core runtime services
ENABLE_USB_HID=1
ENABLE_FRAME_SERVICE=1
ENABLE_AUDIO_SERVICE=1

# Optional management/configuration services
ENABLE_AGENT=1
ENABLE_USB_DHCP=1
ENABLE_CONFIG_WEB=1

# USB compatibility shim scripts (override SDK defaults)
ENABLE_USBDEVICE_SHIM=1
ENABLE_USB0CONFIG_SHIM=1

# System baseline network stack switches
ENABLE_DBUS=1
ENABLE_NETWORK=1
ENABLE_DHCPCD=1
ENABLE_WIFIDRV=1
ENABLE_WLAN_GUARD=1
ENABLE_NTP=1

# NTP fallback server when /etc/ntp.conf is absent. Must be a numeric IPv4
# address so ntpd does not depend on DNS being up at boot. The udhcpc hook
# (/etc/udhcpc/aiden.script) re-runs `S49ntp step` on every DHCP bind so the
# clock catches up the instant the network comes online.
NTP_FALLBACK_SERVER=120.25.115.20

# System baseline service switches
ENABLE_BLUETOOTHD=0
ENABLE_TELNET=0
ENABLE_SMB=0
ENABLE_SSHD=1
