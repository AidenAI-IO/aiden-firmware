# USB identities used while isolating the iOS keyboard from AssistiveTouch.

DYNAMIC_KEYBOARD_GADGET_DIR=/sys/kernel/config/usb_gadget/aiden_hid
DYNAMIC_KEYBOARD_LOCK_DIR=/run/aiden_dynamic_keyboard.lock

# Restore the same identity created by S49usbhid for the normal composite.
DYNAMIC_KEYBOARD_NORMAL_ID_PRODUCT=0x0104
DYNAMIC_KEYBOARD_NORMAL_BCD_DEVICE=0x0100
DYNAMIC_KEYBOARD_NORMAL_SERIAL=0123456789ABCDEF
DYNAMIC_KEYBOARD_NORMAL_PRODUCT="Aiden HID+ECM"

# Use a distinct identity so iOS does not reuse the normal composite descriptor.
DYNAMIC_KEYBOARD_ISOLATED_ID_PRODUCT=0x0121
DYNAMIC_KEYBOARD_ISOLATED_BCD_DEVICE=0x0121
DYNAMIC_KEYBOARD_ISOLATED_SERIAL=AIDENIOSNOPOINT1
DYNAMIC_KEYBOARD_ISOLATED_PRODUCT="Aiden iOS Keyboard+Media ECM"

DYNAMIC_KEYBOARD_USB0_ADDR=192.168.42.1
DYNAMIC_KEYBOARD_USB0_NETMASK=255.255.255.0
DYNAMIC_KEYBOARD_CONFIGURE_TIMEOUT_TENTHS=100
DYNAMIC_KEYBOARD_HOST_SETTLE_SECONDS=1
