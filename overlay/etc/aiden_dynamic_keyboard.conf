# Shared settings for the on-demand iOS USB keyboard profile.
#
# The off/on profiles deliberately use distinct USB identities so iOS cannot
# reuse a cached configuration descriptor that still contains a keyboard.

DYNAMIC_KEYBOARD_GADGET_DIR=/sys/kernel/config/usb_gadget/aiden_hid
DYNAMIC_KEYBOARD_STATE_FILE=/run/aiden_dynamic_keyboard.state
DYNAMIC_KEYBOARD_LOCK_DIR=/run/aiden_dynamic_keyboard.lock

DYNAMIC_KEYBOARD_OFF_ID_PRODUCT=0x0120
DYNAMIC_KEYBOARD_OFF_BCD_DEVICE=0x0120
DYNAMIC_KEYBOARD_OFF_SERIAL=AIDENDYNMOUSEOFF1
DYNAMIC_KEYBOARD_OFF_PRODUCT="Aiden Mouse ECM"

DYNAMIC_KEYBOARD_ON_ID_PRODUCT=0x0121
DYNAMIC_KEYBOARD_ON_BCD_DEVICE=0x0121
DYNAMIC_KEYBOARD_ON_SERIAL=AIDENDYNKEYONLY1
DYNAMIC_KEYBOARD_ON_PRODUCT="Aiden Keyboard ECM"

DYNAMIC_KEYBOARD_USB0_ADDR=192.168.42.1
DYNAMIC_KEYBOARD_USB0_NETMASK=255.255.255.0
DYNAMIC_KEYBOARD_CONFIGURE_TIMEOUT_TENTHS=100
DYNAMIC_KEYBOARD_HOST_SETTLE_SECONDS=1
