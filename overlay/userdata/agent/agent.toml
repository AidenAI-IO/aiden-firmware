################################################################################
# 5. 语音设置
################################################################################

# 5.a Realtime Mode or 5.b Classic Mode
# The HTTP server and Web UI run in every input mode.
# Input mode controls the device-side audio loop:
# - text: HTTP server and Web UI only
# - stt: also run device audio -> STT -> LLM -> TTS (Classic Mode)
# - realtime: run the realtime voice model directly (Realtime Mode)
[voice_settings.mode]
input_mode = "text"

# 5.a Realtime Mode Configuration
# Realtime voice model. When input_mode = "realtime", GPIO wakeup opens a
# continuous PCM duplex session through realtimevoice. The legacy STT/LLM/TTS loop is
# used when input_mode = "stt". In realtime mode, the voice model is
# the non-blocking foreground agent; device and multi-step work is queued to
# the legacy agent loop through create_agent_task.
# [voice_settings.realtime.providers.qwen-main]
# type = "qwen"
# api_key = "$DASHSCOPE_API_KEY"
# model = "qwen-audio-3.0-realtime-plus"
# workspace_id = ""
# region = "cn-beijing" # or "ap-southeast-1"
# endpoint = ""         # optional ws/wss endpoint override
# voice = "longanqian"
#
# [voice_settings.realtime]
# provider = "qwen-main"
# instructions = ""    # optional override; defaults to a short conversation-only prompt
# enable_speech_emotion = true
# input_audio_format = "pcm"
# output_audio_format = "pcm"
# turn_detection = "server_vad" # or "smart_turn"
# turn_detection_threshold = 0.5
# turn_detection_silence_ms = 800

# 5.b Classic Mode Configuration (STT + TTS)

# RKNN Silero VAD parameters (for Classic Mode)
# Only used when input_mode is "stt"
[voice_settings.classic.runtime]
# vad_backend = "rknn" # "rknn" (NPU encoder + CPU LSTM/decoder) or "cpu"
# vad_model_path = "/oem/usr/model/silero_vad_6_2_encoder_rv1106_w8a8_v1.rknn"
# vad_helper_path = "/oem/usr/bin/rknn_vad"
# vad_speech_threshold = 0.5
# silence_ms = 550          # Silence duration to end utterance (ms)
# min_speech_ms = 300       # Minimum speech duration to accept (ms)

# Wakeup voice session parameters (for Classic Mode)
# Only used when input_mode = "stt"
# voice_followup_enabled = false
# voice_followup_timeout_ms = 5000
# voice_first_turn_timeout_ms = 10000
# voice_max_turns = 0
# voice_interrupt_on_wakeup = true
# voice_streaming_tts_enabled = true
# voice_tool_call_speech = true
# voice_progress_speech_enabled = true
# voice_max_response_tokens = 300

# 5.b.a Speech-to-Text (STT) configuration
# Required when input_mode = "stt"
[voice_settings.classic.stt.providers.openai-main]
type = "openai-whisper"
api_key = "$OPENAI_API_KEY"
model = "whisper-1"
# base_url = "https://api.openai.com/v1"  # Optional: custom endpoint

[voice_settings.classic.stt]
provider = "openai-main"

# For OpenRouter STT:
# [voice_settings.classic.stt.providers.openrouter-main]
# type = "openrouter"
# api_key = "$OPENROUTER_API_KEY"
# model = "qwen/qwen3-asr-flash-2026-02-10"
# Set [voice_settings.classic.stt].provider = "openrouter-main" to select it.

# For Tencent ASR (alternative to OpenAI Whisper):
# [voice_settings.classic.stt.providers.tencent-main]
# type = "tencent-asr"  # legacy aliases: tencent, tencent_asr
# app_id = "TENCENT_APP_ID"   # Required for realtime upload during recording
# secret_id = "TENCENT_SECRET_ID"
# secret_key = "TENCENT_SECRET_KEY"
# region = "ap-shanghai"
# engine_model_type = "16k_zh"
# Set [voice_settings.classic.stt].provider = "tencent-main" to select it.

# For OpenRouter STT:
# [voice_settings.classic.stt.providers.openrouter-main]
# type = "openrouter"
# api_key = "$OPENROUTER_API_KEY"
# model = "qwen/qwen3-asr-flash-2026-02-10"
# Set [voice_settings.classic.stt].provider = "openrouter-main" to select it.

# For Tencent ASR (alternative to OpenAI Whisper):
# [voice_settings.classic.stt.providers.tencent-main]
# type = "tencent-asr"  # legacy aliases: tencent, tencent_asr
# app_id = "TENCENT_APP_ID"   # Required for realtime upload during recording
# secret_id = "TENCENT_SECRET_ID"
# secret_key = "TENCENT_SECRET_KEY"
# region = "ap-shanghai"
# engine_model_type = "16k_zh"
# Set [voice_settings.classic.stt].provider = "tencent-main" to select it.

# 5.b.b Text-to-Speech (TTS) configuration
# Required when input_mode = "stt"
[voice_settings.classic.tts.providers.minimax-main]
type = "minimax-cn"
api_key = "$MINIMAX_API_KEY"
voice_id = "male-qn-qingse"   # Voice ID from Minimax
emotion = "happy"             # Emotion: happy, sad, angry, etc.

[voice_settings.classic.tts]
provider = "minimax-main"
# speed = 1.0                 # Speech speed: 0.5 - 2.0

# 5.b.c Audio service configuration (for Classic Mode)
[voice_settings.classic.audio]
# socket = "/run/audio_service/audio_service.sock"
# sample_rate = 16000
# channels = 1
# bit_width = 16
# backend = "auto" # Selects recording and playback together: audio_service on board, local recorder/player in PC/ADB agent mode

# 5.b.d Audio archive configuration (optional, for Classic Mode)
# When enabled, saves audio recordings to disk for playback in web UI.
[voice_settings.classic.audio_archive]
# enabled = true              # Set false to stop archiving audio files
# max_files = 500             # Keep most recent N audio files
# max_size_mb = 100           # Or stop when total size exceeds this (MB)
# storage_path = "/userdata/audio"  # Where to store audio files
                                    # Setting a path other than the default above
                                    # bypasses the SD/eMMC storage modes; the
                                    # default is the managed eMMC tier

