# Agent instruction and behavior
instruction = "默认用简体中文回答，语气要像真人说话，简短自然，适合 TTS 播放。需要读取或改变手机、外部设备或服务状态时必须使用工具；可以连续组合多个工具完成任务。每次截图或输入工具返回 post-action screenshot 后，都要先根据最新画面判断上一步是否已经生效、焦点是否改变、页面是否跳转；不要连续重复同一个点击、手势或按键。在手机上打开 App、查找联系人、设置项、商品或页面内容时，优先使用系统搜索、App 内搜索或页面上的搜索框；不要先靠连续滑动、翻页来碰运气。keyboard_text 是模拟美式键盘按键，必须传 JSON，例如 {\"text\":\"App Store\"}；不要传裸字符串；只能输入 ASCII 可键入字符，不能直接输入中文、emoji 或其他非键盘字符，需要中文时改用拼音/英文关键词并从候选或搜索结果中选择。点击要以最新截图为准，选择可见目标的中心点，并优先使用 coord_space:\"normalized\" 的 0..1 坐标；手机投屏/截图可能被缩放，pixel 坐标容易和实际触控坐标偏移。除非用户明确要求或坐标系已经校准，不要使用 coord_space:\"pixel\"。坐标不确定时先截图确认，不要用大概位置连续试点。用户要求拨打电话时，把它当作手机 UI 自动化任务：先用截图确认状态，再用 touch_gesture、mouse_click、keyboard_text、keyboard_tap 等工具打开拨号或联系人、输入号码并点击拨号；不要因为没有单独的拨打电话工具就说做不到。手机边缘手势要从物理边缘附近开始，返回优先用 touch_gesture 的 type back，回主屏优先用 type home；手写 swipe 时左边缘返回用 start.x=0.001 左右，底边回主页用 start.y=0.999 左右。"
additional_prompt = ""
max_iterations = -1

# Input mode:
# - text: run HTTP server with Web UI
# - stt: device audio -> STT -> LLM -> TTS
# - audio: device audio -> LLM audio attachment -> TTS
#   Use audio mode only with a provider/model path that supports audio input.
input_mode = "text"

# Trigger mode: "manual" (push-to-talk) or "wakeup" (GPIO trigger)
# Only used when input_mode is "stt" or "audio"
trigger_mode = "manual"

# RKNN Silero VAD parameters
# Only used when input_mode is "stt" or "audio"
vad_backend = "rknn" # "rknn" (NPU encoder + CPU LSTM/decoder) or "cpu"
vad_model_path = "/userdata/agent/model/silero_vad_6_2_encoder_rv1106_w8a8_v1.rknn"
vad_helper_path = "/oem/usr/bin/rknn_vad"
vad_speech_threshold = 0.5
silence_ms = 650          # Silence duration to end utterance (ms)
min_speech_ms = 300       # Minimum speech duration to accept (ms)

# Wakeup voice session parameters
# Only used when input_mode = "stt" and trigger_mode = "wakeup"
voice_session_enabled = true
voice_followup_timeout_ms = 6000
voice_first_turn_timeout_ms = 10000
voice_max_turns = 0
voice_interrupt_on_wakeup = true
voice_streaming_tts_enabled = true
voice_tool_call_speech = true
voice_max_response_tokens = 400

# Primary LLM model configuration
[model]
provider = "openrouter"
model = "google/gemini-3.5-flash"
api_key = "OPENROUTER_API_KEY"
temperature = 0.2
max_tokens = 1000

# Optional request proxy configuration for outbound Agent HTTP requests.
# Leave all fields blank to use the process environment (HTTP_PROXY / HTTPS_PROXY / NO_PROXY).
[proxy]
http_proxy = ""
https_proxy = ""
all_proxy = ""
no_proxy = ""

# Optional future field parsed by config but not currently used by the runtime.
# [model_text]
# provider = "openrouter"
# model = "anthropic/claude-3.5-sonnet"
# api_key = "OPENROUTER_API_KEY"

# Audio service configuration
[audio]
socket = "/run/audio_service/audio_service.sock"
sample_rate = 16000
channels = 1
bit_width = 16

# Speech-to-Text (STT) configuration
# Required when input_mode = "stt"
[stt]
provider = "openai-whisper"  # "openai-whisper", "openrouter", or "tencent"
api_key = "OPENAI_API_KEY"
model = "whisper-1"
# base_url = "https://api.openai.com/v1"  # Optional: custom endpoint

# For OpenRouter STT:
# provider = "openrouter"
# api_key = "OPENROUTER_API_KEY"
# model = "qwen/qwen3-asr-flash-2026-02-10"
# base_url = "https://openrouter.ai/api/v1"  # Optional: custom endpoint

# For Tencent ASR (alternative to OpenAI Whisper):
# provider = "tencent"
# secret_id = "TENCENT_SECRET_ID"
# secret_key = "TENCENT_SECRET_KEY"
# region = "ap-guangzhou"
# engine_model_type = "16k_zh"

# Text-to-Speech (TTS) configuration
# Required when input_mode = "stt" or "audio"
[tts]
provider = "minimax"
api_key = "MINIMAX_API_KEY"
voice_id = "male-qn-qingse"  # Voice ID from Minimax
emotion = "happy"             # Emotion: happy, sad, angry, etc.
speed = 1.0                   # Speech speed: 0.5 - 2.0

# HID (Human Interface Device) configuration
[hid]
keyboard_device = "/dev/hidg0"
mouse_device = "/dev/hidg1"
frame_socket = "/run/frame_service/frame_service.sock"

# Web search tool configuration
# provider: "duckduckgo" (free, no key) or "tavily" (better results, needs api_key)
[search]
provider = "duckduckgo"
api_key = ""
