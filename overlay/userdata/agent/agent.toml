# Agent instruction and behavior
instruction = ""
additional_prompt = ""
max_iterations = -1
force_simple_loop = false

# Screenshot context pruning:
# keep the latest N screenshots and batch-prune older screenshots every interval
# to keep long runs bounded without changing the cached message prefix every turn.
screenshot_keep_n = 3
screenshot_prune_interval = 25

# Input mode:
# - text: run HTTP server with Web UI
# - stt: device audio -> STT -> LLM -> TTS
# - audio: device audio -> LLM audio attachment -> TTS
#   Use audio mode only with a provider/model path that supports audio input.
input_mode = "text"

# Trigger mode: "manual" (push-to-talk) or "wakeup" (GPIO trigger)
# Only used when input_mode is "stt" or "audio"
trigger_mode = "manual"

# RKNN Silero VAD parameters
# Only used when input_mode is "stt" or "audio"
vad_backend = "rknn" # "rknn" (NPU encoder + CPU LSTM/decoder) or "cpu"
vad_model_path = "/oem/usr/model/silero_vad_6_2_encoder_rv1106_w8a8_v1.rknn"
vad_helper_path = "/oem/usr/bin/rknn_vad"
vad_speech_threshold = 0.5
silence_ms = 650          # Silence duration to end utterance (ms)
min_speech_ms = 300       # Minimum speech duration to accept (ms)

# Wakeup voice session parameters
# Only used when input_mode = "stt" and trigger_mode = "wakeup"
voice_session_enabled = true
voice_followup_timeout_ms = 6000
voice_first_turn_timeout_ms = 10000
voice_max_turns = 0
voice_interrupt_on_wakeup = true
voice_streaming_tts_enabled = true
voice_tool_call_speech = false
voice_progress_speech_enabled = true
voice_speech_summary_enabled = true
voice_speech_max_runes = 120
voice_max_response_tokens = 400

# Primary LLM model configuration
[model]
provider = "openrouter"
model = "google/gemini-3.5-flash"
api_key = "OPENROUTER_API_KEY"
temperature = 0.2
max_response_tokens = 1000
# Optional model metadata overrides. Leave unset or 0 for provider metadata auto-discovery when available.
# context_window = 128000
# model_max_output_tokens = 8192

# Optional future field parsed by config but not currently used by the runtime.
# [model_text]
# provider = "openrouter"
# model = "anthropic/claude-3.5-sonnet"
# api_key = "OPENROUTER_API_KEY"

# Audio service configuration
[audio]
socket = "/run/audio_service/audio_service.sock"
sample_rate = 16000
channels = 1
bit_width = 16

# Audio archive configuration (optional)
# When enabled, saves audio recordings to disk for playback in web UI.
# Default: enabled.
[audio_archive]
enabled = true               # Set false to stop archiving audio files
max_files = 500             # Keep most recent N audio files
max_size_mb = 100           # Or stop when total size exceeds this (MB)
storage_path = "/userdata/audio"  # Where to store audio files

# Speech-to-Text (STT) configuration
# Required when input_mode = "stt"
[stt]
provider = "openai-whisper"  # "openai-whisper", "openrouter", "tencent", or "tencent_asr"
api_key = "OPENAI_API_KEY"
model = "whisper-1"
# base_url = "https://api.openai.com/v1"  # Optional: custom endpoint

# For OpenRouter STT:
# provider = "openrouter"
# api_key = "OPENROUTER_API_KEY"
# model = "qwen/qwen3-asr-flash-2026-02-10"
# base_url = "https://openrouter.ai/api/v1"  # Optional: custom endpoint

# For Tencent ASR (alternative to OpenAI Whisper):
# provider = "tencent_asr"  # alias: tencent
# secret_id = "TENCENT_SECRET_ID"
# secret_key = "TENCENT_SECRET_KEY"
# region = "ap-guangzhou"
# engine_model_type = "16k_zh"

# Text-to-Speech (TTS) configuration
# Required when input_mode = "stt" or "audio"
[tts]
provider = "minimax-ws"
api_key = "MINIMAX_API_KEY"
voice_id = "male-qn-qingse"  # Voice ID from Minimax
emotion = "happy"             # Emotion: happy, sad, angry, etc.
speed = 1.0                   # Speech speed: 0.5 - 2.0

# HID (Human Interface Device) configuration
[hid]
keyboard_device = "/dev/hidg0"
mouse_device = "/dev/hidg1"
frame_socket = "/run/frame_service/frame_service.sock"
# pointer_mode = "absolute"     # default, iOS AssistiveTouch / absolute mouse
# pointer_mode = "touchscreen"  # Android HID touch screen / digitizer

# Web search tool configuration
# provider: "duckduckgo" (free, no key), "brave" (Brave Search, needs api_key), or "tavily" (needs api_key)
[search]
provider = "duckduckgo"
api_key = ""

# Episode telemetry (Langfuse). Disabled by default.
# Set enabled = true and configure base_url + public_key + secret_key.
# [telemetry]
# enabled = false
# provider = "langfuse"
# base_url = "http://langfuse.example.com:3000"
# public_key = "pk-lf-..."
# secret_key = "sk-lf-..."
# upload_screenshots = true
# upload_timeout_sec = 30
# max_retry = 2
# environment = "default"
# tags = ["aiden-hardware"]
