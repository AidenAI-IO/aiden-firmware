<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aiden LLM Logs</title>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/llm-logs.css">
</head>
<body>
  <div class="topbar">
    <a href="/">← Back to Config</a>
    <h1>LLM HTTP Logs</h1>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-head">
        <span style="font-size:13px;font-weight:600">Log Files</span>
        <div class="sidebar-actions"><button class="button" data-action="refresh-files">Refresh</button><button class="button" data-action="trigger-import">Import Raw</button></div>
      </div>
      <input id="importFileInput" type="file" accept=".log,text/plain" style="display:none" data-action="import-file">
      <div id="actionStatus" class="action-status">Import restores an exported llm-http-*.log file exactly as-is.</div>
      <div id="fileList"></div>
    </div>
    <div class="detail">
      <div class="request-list">
        <div class="request-list-head">Requests</div>
        <div id="requestList">
          <div class="empty" style="padding:12px">Select a log file to view requests.</div>
        </div>
      </div>
      <div class="request-detail">
        <div class="request-detail-head"><span id="detailTitle">Request Detail</span><div class="detail-head-actions"><button class="button" id="exportRawBtn" data-action="export-raw" disabled>Export Raw</button></div></div>
        <div id="requestDetail" style="padding:18px 20px">
          <div class="empty">Select a request to view details.</div>
        </div>
      </div>
    </div>
  </div>
  <script defer src="/assets/js/llm-logs.js"></script>
</body>
</html>
