<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Aiden 设置</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/ds.css">
</head>
<body>
  <!--
    Content area only. The native screen hosting this WebView owns the navigation
    bar, so the shell renders no header of its own; on a desktop browser the
    navigation rail below the breakpoint in layout.css takes that role instead.

    Routes are real paths (/wifi, /wifi/:ssid, ...) and the server repeats the
    document for them as an SPA fallback, so a sub-route can be reloaded or
    deep-linked directly.
  -->
  <div id="app"></div>

  <script type="module">
    import {boot} from '/assets/js/app/shell.js';

    boot().catch(error => {
      console.error('[settings] failed to start', error);
      const host = document.getElementById('app');
      if (host) host.textContent = '设置加载失败';
    });
  </script>
</body>
</html>
