################################################################################
# Wi-Fi and Bluetooth Settings
################################################################################
# WiFi: configured through Config Web at /
# Bluetooth: managed by separate bluetooth service

################################################################################
# Basic Settings
################################################################################

# Language and Time Zone
# Device UI and Agent response language: "zh-CN" or "en-US".
# This is independent from [voice_settings.classic.stt].language, which only controls speech recognition.
[basic_settings.language_timezone]
# locale = "en-US"  # "zh-CN" or "en-US"; also selects built-in voice notification text
# timezone = "UTC"  # IANA time zone used by Agent date context and controller shell commands

# Device Settings
# Target device configuration.
# Android derives HID pointer_mode = "touchscreen"; iOS, macOS, windows, and linux derive "absolute".
# Accepted device_type values: "iOS", "Android", "macOS", "windows", or "linux".
[basic_settings.device]
# device_type = "iOS"


# USB keyboard layout shown in Basic Settings.
[basic_settings.device.hid]
# keyboard_layout = "qwerty"  # "qwerty", "azerty", or "qwertz"
################################################################################
# Conversation Settings
################################################################################

[conversation_settings.agent]
# Prompt appended after the built-in Agent instruction
# prompt = ""

# Maximum tool-call iterations
# max_iterations = -1

# History pruning threshold
# Context size management. Both values are fractions of the usable model input
# budget: either 0 to select the default, or greater than 0 and less than 1.
# Omitting a value uses the default shown.
#
# Deterministic cleanup of stale state and older tool exchanges, including
# during one long-running tool loop. It cleans down to 6/7 of the trigger. This
# is the cheap pass and runs first; its effective value is capped at
# context_compaction_threshold below.
# context_prune_threshold = 0.5

# Context compaction threshold
# Point at which the conversation is summarized into a compaction message by the
# LLM. Lower it to summarize earlier and keep prompts smaller; raise it to keep
# more raw transcript at the cost of larger prompts.
# context_compaction_threshold = 0.8

# Screenshot context pruning:
# keep the latest N screenshots and batch-prune older screenshots every interval
# to keep long runs bounded without changing the cached message prefix every turn.
# screenshot_keep_n = 3
# screenshot_prune_interval = 2

# Tool Settings


# Web search tool configuration.
# provider: "duckduckgo" (free, no key), "brave" (requires api_key), or "tavily" (requires api_key)
[conversation_settings.search]
# provider = "duckduckgo"
# api_key = ""
# Tiered loop guard and termination policy. Zero-valued numeric fields use defaults.
[conversation_settings.termination_policy]
# enabled = true
# max_seconds = 0
# repeat_action_limit = 3
# same_result_limit = 3
# screen_unchanged_limit = 5
# soft_notice_stall_score = 2
# restrict_tools_stall_score = 4
# terminate_stall_score = 6
# parse_failure_limit = 3

################################################################################
# Main Model Settings
################################################################################

# Provider selection and credentials
# Primary LLM provider and model configuration
[model_settings.providers.openai-main]
type = "openai"
api_key = "$OPENAI_API_KEY"

# For direct Anthropic Claude access, use the native "anthropic" provider.
# ANTHROPIC_AUTH_TOKEN uses bearer authentication (Claude Code-compatible);
# ANTHROPIC_API_KEY and other api_key values use the x-api-key header.
# A base_url may point to either a host or an endpoint ending in /v1.
# [model_settings.providers.claude-main]
# type = "anthropic"
# api_key = "$ANTHROPIC_AUTH_TOKEN"
# base_url = "https://api.anthropic.com/v1"
# Then edit the [model_settings.model] section below to select it:
# provider = "claude-main"
# model = "claude-sonnet-4-6"

# For Moonshot Kimi K3, use the "kimi" (global) or "kimi-cn" (mainland China)
# provider. Each uses its built-in Moonshot endpoint, so only model + api_key
# are needed. Custom base_url values are not supported for Kimi providers.
# Moonshot's official endpoint supports Chat Completions, not /responses, so
# keep api_mode unset (or set it to "chat_completions").
# [model_settings.providers.kimi-main]
# type = "kimi"           # global: https://api.moonshot.ai/v1
# type = "kimi-cn"        # mainland China: https://api.moonshot.cn/v1
# api_key = "$MOONSHOT_API_KEY"
# Set [model_settings.model].provider = "kimi-main" to select it.
# model = "kimi-k3"

# For Volcengine Ark (Doubao), use the "volcengine" provider. It uses its
# built-in OpenAI-compatible endpoint, so only model + api_key are needed.
# Custom base_url values are not supported for Volcengine providers.
# Ark supports api_mode = "responses_stateful" with store + previous_response_id,
# without requiring caching. Aiden does not send its OpenAI-specific compaction
# array or truncation setting to Ark; Ark's own context_management schema differs.
# [model_settings.providers.ark-main]
# type = "volcengine"      # https://ark.cn-beijing.volces.com/api/v3
# api_key = "$ARK_API_KEY"
# Set [model_settings.model].provider = "ark-main" to select it.
# model = "doubao-seed-2-1-pro-260628"
# Ark treats an omitted reasoning_effort as "high", which delays the first
# streamed token; the registry pins "low" for the model above. Ark accepts
# minimal/low/medium/high ("none" is not an Ark level).
# reasoning_effort = "minimal"

# For DeepSeek, use the built-in OpenAI-compatible endpoint. DeepSeek's API
# defaults to thinking mode; Aiden selects reasoning_effort = "none" for the
# built-in model entries for fast replies. Explicit low/high/max enables
# thinking with reasoning_content replay across tool-call turns; temperature is
# omitted while thinking is enabled because DeepSeek does not apply it.
# Use api_mode = "responses" for DeepSeek's stateless Responses API. It keeps
# full context locally; responses_stateful is not supported by DeepSeek.
# [model_settings.providers.deepseek-main]
# type = "deepseek"      # https://api.deepseek.com
# api_key = "$DEEPSEEK_API_KEY"
# Set [model_settings.model].provider = "deepseek-main" to select it.
# model = "deepseek-flash"
# api_mode = "responses"
# reasoning_effort = "none"

# Google Gemini always uses the native Interactions API. The OpenAI-compatible
# /chat/completions path is not used: it cannot replay the thought_signature
# Gemini 3 requires, so multi-turn tool calls fail there with HTTP 400.
# "interactions" resubmits the local StepList with store=false;
# "interactions_stateful" stores the interaction and chains follow-up turns with
# previous_interaction_id. An unset api_mode selects "interactions".
# The native endpoint uses x-goog-api-key.
# [model_settings.providers.gemini-main]
# type = "gemini"       # native: https://generativelanguage.googleapis.com/v1beta
# api_key = "$GEMINI_API_KEY"
# Set [model_settings.model].provider = "gemini-main" to select it.
# model = "gemini-3.8-flash"
# api_mode = "interactions"
# reasoning_effort = "low"  # gemini-3.8-flash: low/medium/high

# Model configuration
[model_settings.model]
provider = "openai-main"
model = "gpt-5.5"
# temperature = 0.2
# max_response_tokens = 1000
# Responses API experiments: "responses" uses local history with store=false;
# "responses_stateful" lets the provider retain and chain context.
# api_mode = "responses"
# api_mode = "responses_stateful"
# Gemini native modes: "interactions" uses local StepList history;
# "interactions_stateful" chains stored interactions with previous_interaction_id.
# responses_context_management = "compaction"
# responses_compact_threshold = 0
# responses_truncation = "auto"
# responses_include = ["reasoning.encrypted_content"]
# Optional model metadata overrides. Leave unset or 0 for provider metadata auto-discovery when available.
# context_window = 128000
# model_max_output_tokens = 8192

################################################################################
# Voice Settings
################################################################################

# Realtime or Classic mode
# The HTTP server and Web UI run in every mode.
# Input mode controls the device-side audio loop:
# - stt: device audio -> STT -> LLM -> TTS (Classic Mode)
# - realtime: run the realtime voice model directly (Realtime Mode)
[voice_settings.mode]
input_mode = "stt"

# Realtime voice configuration
# Realtime voice model. When input_mode = "realtime", GPIO wakeup opens a
# continuous PCM duplex session through realtimevoice. The legacy STT/LLM/TTS loop is
# used when input_mode = "stt". In realtime mode, the voice model is
# the non-blocking foreground agent; device and multi-step work is queued to
# the legacy agent loop through create_agent_task.
# [voice_settings.realtime.providers.qwen-main]
# type = "qwen"
# api_key = "$DASHSCOPE_API_KEY"
# model = "qwen-audio-3.0-realtime-plus"
# workspace_id = ""
# region = "cn-beijing" # or "ap-southeast-1"
# endpoint = ""         # optional ws/wss endpoint override
# voice = "longanqian"
# turn_detection = "server_vad" # or "smart_turn"
# turn_detection_threshold = 0.5
# turn_detection_silence_ms = 800
#
# [voice_settings.realtime]
# provider = "qwen-main"
# enable_speech_emotion = true
# input_audio_format = "pcm"
# output_audio_format = "pcm"

# Classic voice configuration (STT + TTS)

# RKNN Silero VAD parameters (for Classic Mode)
# Only used when input_mode is "stt"
[voice_settings.classic.runtime]
# vad_backend = "rknn" # "rknn" (NPU encoder + CPU LSTM/decoder) or "cpu"
# vad_model_path = "/usr/lib/aiden/models/silero_vad_6_2_encoder_rv1106_w8a8_v1.rknn"
# vad_helper_path = "/usr/lib/aiden/rknn_vad"
# vad_speech_threshold = 0.5
# silence_ms = 550          # Silence duration to end utterance (ms)
# min_speech_ms = 300       # Minimum speech duration to accept (ms)

# Wakeup voice session parameters (for Classic Mode)
# Only used when input_mode = "stt"
# voice_followup_enabled = false
# voice_followup_timeout_ms = 5000
# voice_first_turn_timeout_ms = 10000
# voice_max_turns = 0
# voice_interrupt_on_wakeup = true
# voice_streaming_tts_enabled = true
# voice_tool_call_speech = true
# voice_progress_speech_enabled = true
# voice_max_response_tokens = 300

# Speech-to-Text (STT) configuration
# Required when input_mode = "stt"
[voice_settings.classic.stt.providers.openai-main]
type = "openai-whisper"
api_key = "$OPENAI_API_KEY"
model = "whisper-1"
# base_url = "https://api.openai.com/v1"  # Optional: custom endpoint

[voice_settings.classic.stt]
provider = "openai-main"

# For OpenRouter STT:
# [voice_settings.classic.stt.providers.openrouter-main]
# type = "openrouter"
# api_key = "$OPENROUTER_API_KEY"
# model = "qwen/qwen3-asr-flash-2026-02-10"
# Set [voice_settings.classic.stt].provider = "openrouter-main" to select it.

# For Tencent ASR (alternative to OpenAI Whisper):
# [voice_settings.classic.stt.providers.tencent-main]
# type = "tencent-asr"  # legacy aliases: tencent, tencent_asr
# app_id = "TENCENT_APP_ID"   # Required for realtime upload during recording
# secret_id = "TENCENT_SECRET_ID"
# secret_key = "TENCENT_SECRET_KEY"
# region = "ap-shanghai"
# engine_model_type = "16k_zh"
# Set [voice_settings.classic.stt].provider = "tencent-main" to select it.

# Text-to-Speech (TTS) configuration
# Required when input_mode = "stt"
[voice_settings.classic.tts.providers.minimax-main]
type = "minimax-cn"
api_key = "$MINIMAX_API_KEY"
voice_id = "male-qn-qingse"   # Voice ID from Minimax
emotion = "happy"             # Emotion: happy, sad, angry, etc.

[voice_settings.classic.tts]
provider = "minimax-main"
# speed = 1.0                 # Speech speed: 0.5 - 2.0

# Audio service configuration for Classic Mode
[voice_settings.classic.audio]
# socket = "/run/audio_service/audio_service.sock"
# sample_rate = 16000
# channels = 1
# bit_width = 16
# backend = "auto" # Selects recording and playback together: audio_service on board, local recorder/player in PC/ADB agent mode

# Optional audio archive configuration for Classic Mode
# When enabled, saves audio recordings to disk for playback in web UI.
[voice_settings.classic.audio_archive]
# enabled = true              # Set false to stop archiving audio files
# max_files = 500             # Keep most recent N audio files
# max_size_mb = 100           # Or stop when total size exceeds this (MB)
# storage_path = "/userdata/audio"  # Where to store audio files
                                    # Setting a path other than the default above
                                    # bypasses the SD/eMMC storage modes; the
                                    # default is the managed eMMC tier

################################################################################
# Memory Settings
################################################################################

# Screen memory retention
# Quick Capture uses the verified spare falling-edge input on the 40Pin header:
# Luckfox Pico Zero physical pin 38 (GPIO3). GPIO32/GPIO33 remain legacy wakeup.
[memory_settings.screen]
# enabled = true
# gpio_pin = 3
# screen_memory_ttl = "90d"

# Notification memory retention
# Voice notifications follow a normal Agent reply, or use an idle Realtime
# session for a private announcement.
[memory_settings.notification]
# enabled = true
# max_pending = 8
# retention_days = 14

[memory_settings.notification.response_tail]
# enabled = true
# max_items = 1
# max_text_chars = 40

[memory_settings.notification.expiration]
# default_ttl_seconds = 0

[memory_settings.notification.expiration.code_ttl_seconds]
# storage = 900

# Reset conversation and memory
# Handled through Config Web UI and Device Management API

################################################################################
# Storage Settings
################################################################################

# Storage status, microSD settings, backup, and restore
# Storage mode is automatic: a usable card means dual storage, otherwise
# eMMC only. StorageMonitor independently protects the persistent data root.
[storage_settings.storage]
# mount_point = "/mnt/sdcard"       # Where a usable card is mounted
# device = "mmcblk2"                # SD card block device base name
# min_card_free_mb = 64             # Cards with less free space are rejected
# migrate_start_free_pct = 10       # Start migrating below this eMMC free %
# migrate_stop_free_pct = 50        # Stop once eMMC free % reaches this
# monitor_enabled = true             # Capacity monitoring; SD management remains automatic
# root_path = "/userdata"
# check_interval_seconds = 300
# warning_threshold_mb = 50
# critical_threshold_mb = 10
# emergency_threshold_mb = 5
# recovery_hysteresis_mb = 5

[storage_settings.storage.degraded_mode]
# disable_llm_http_log = true
# disable_audio_archive = true
# disable_session_archive = true
# max_agent_log_mb = 1

[storage_settings.storage.cleanup]
# enabled = true
# llm_http_log_retention_days = [7, 3, 1, 0]
# audio_archive_retention_days = [30, 7, 0]
# session_archive_retention_days = [30]
# cleanup_retry_interval_seconds = 60

################################################################################
# Advanced Settings
################################################################################

# Logs
# Log retention configuration
[advanced_settings.log]
# level = "info"                # debug, info, warn, or error
# llm_http_retention_days = 7  # Keep llm-http-*.log files for this many days
# log_raw_http = true          # Record detailed model HTTP requests

# Manual configuration
# Handled through the validated raw TOML editor in Config Web

# Internal HID device paths and input backend.
[advanced_settings.hardware.hid]
# keyboard_device = "/dev/hidg0"
# mouse_device = "/dev/hidg1"
# android_keyboard_device = "/dev/hidg2"  # hid.usb2 Consumer Control keys; Android nav keys in touchscreen mode, media/volume/brightness/screenshot keys in absolute mode
# frame_socket = "/run/frame_service/frame_service.sock"
# input_backend = "hid"         # "hid" writes USB HID reports; "adb" uses adb shell input for Android taps/keys/text

# Keep the RK628 CSI capture stream enabled between screenshots. Enabling this
# reduces screenshot latency but increases idle power consumption.
[advanced_settings.hardware.frame_service]
# keep_streamon = false

# Live Activity / Dynamic Island.
# State updates stay local: BLE carries only a wake hint and the iOS app reads
# the current snapshot over USB ECM before updating ActivityKit.
[advanced_settings.runtime.live_activity]
# enabled = true

# Episode telemetry (Langfuse). Disabled by default.
# Set enabled = true and configure base_url + public_key + secret_key.
[advanced_settings.runtime.telemetry]
# enabled = false
# provider = "langfuse"
# base_url = "http://langfuse.example.com:3000"
# public_key = "pk-lf-..."
# secret_key = "sk-lf-..."
# upload_screenshots = true
# upload_timeout_sec = 30
# max_retry = 2
# environment = "default"
# tags = ["aiden-hardware"]

